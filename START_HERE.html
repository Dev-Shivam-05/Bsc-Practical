logout.\n6. Programs 8 and 10 use hard-coded demo credentials `Prince` / `prince123`; these are teaching demonstrations, **not secure production authentication**.\n7. The deliverable's .NET compilation, SQL Server connection, and HTTP behavior are **not runtime-verified** here because a Windows .NET Framework/SQL Server toolchain is unavailable.\n"}, {"name": "LoginSession.aspx.vb", "text": "Partial Class LoginSession\n    Inherits System.Web.UI.Page\n    Protected Sub btnLogin_Click(sender As Object, e As EventArgs)\n        If txtUser.Text <> \"Prince\" OrElse txtPass.Text <> \"prince123\" Then\n            lblMessage.Text = \"Invalid username or password.\"\n            Return\n        End If\n        Session(\"user\") = txtUser.Text\n        Dim cookie As New HttpCookie(\"user\", Server.UrlEncode(txtUser.Text))\n        cookie.Expires = DateTime.Now.AddDays(1)\n        cookie.HttpOnly = True\n        cookie.Secure = Request.IsSecureConnection\n        Response.Cookies.Add(cookie)\n        Response.Redirect(\"WelcomeSession.aspx\")\n    End Sub\nEnd Class\n"}, {"name": "PracticalDB.sql", "text": "-- SQL Server / LocalDB. Run in SSMS or sqlcmd before testing database pages.\nIF DB_ID('PracticalDB') IS NULL CREATE DATABASE PracticalDB;\nGO\nUSE PracticalDB;\nGO\nIF OBJECT_ID('dbo.Students','U') IS NULL\nCREATE TABLE dbo.Students (\n  RollNo INT PRIMARY KEY, Name NVARCHAR(50) NOT NULL,\n  Age INT NOT NULL CHECK (Age BETWEEN 1 AND 120),\n  Gender NVARCHAR(10) NOT NULL, Course NVARCHAR(30) NOT NULL\n);\nIF OBJECT_ID('dbo.Employee','U') IS NULL\nCREATE TABLE dbo.Employee (\n  EmployeeID INT IDENTITY(1,1) PRIMARY KEY,\n  EmployeeName NVARCHAR(50) NOT NULL, Department NVARCHAR(30) NOT NULL,\n  Salary DECIMAL(10,2) NOT NULL CHECK (Salary >= 0),\n  ContactNo NVARCHAR(15) NOT NULL\n);\nIF OBJECT_ID('dbo.Customer','U') IS NULL\nCREATE TABLE dbo.Customer (\n  CustomerID INT IDENTITY(1,1) PRIMARY KEY,\n  CustomerName NVARCHAR(50) NOT NULL, Email NVARCHAR(60) NOT NULL,\n  Phone NVARCHAR(15) NOT NULL, Address NVARCHAR(100) NOT NULL\n);\nIF OBJECT_ID('dbo.Medicine','U') IS NULL\nCREATE TABLE dbo.Medicine (\n  MedicineID INT IDENTITY(1,1) PRIMARY KEY,\n  MedicineName NVARCHAR(50) NOT NULL, Category NVARCHAR(30) NOT NULL,\n  Price DECIMAL(10,2) NOT NULL CHECK (Price >= 0),\n  Quantity INT NOT NULL CHECK (Quantity >= 0), ExpiryDate DATE NOT NULL\n);\nGO\n-- Demonstration rows only, inserted once when empty.\nIF NOT EXISTS (SELECT 1 FROM dbo.Students)\n INSERT dbo.Students (RollNo,Name,Age,Gender,Course) VALUES\n (101,'Prince',19,'Male','BCA'),(102,'Karan',20,'Male','BCA'),\n (103,'Harshit',21,'Male','BBA'),(104,'Jeel',18,'Male','BA');\nIF NOT EXISTS (SELECT 1 FROM dbo.Employee)\n INSERT dbo.Employee (EmployeeName,Department,Salary,ContactNo) VALUES\n ('Prince','IT',45000,'9568650011'),('Karan','HR',32000,'9876588022'),\n ('Harshit','Sales',38000,'9876567033');\nIF NOT EXISTS (SELECT 1 FROM dbo.Customer)\n INSERT dbo.Customer (CustomerName,Email,Phone,Address) VALUES\n ('Kevin','kevin4@example.com','9876589044','Surat'),\n ('Ram','ram3@example.com','9876592033','Gandhinagar');\nIF NOT EXISTS (SELECT 1 FROM dbo.Medicine)\n INSERT dbo.Medicine (MedicineName,Category,Price,Quantity,ExpiryDate) VALUES\n ('Cetirizine','Tablet',35.50,80,'2027-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" />\n  <\/connectionStrings>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"4.7.2\" />\n    <httpRuntime targetFramework=\"4.7.2\" />\n  <\/system.web>\n<\/configuration>\n"}, {"name": "WelcomeSession.aspx", "text": "<%@ Page Language=\"VB\" AutoEventWireup=\"true\" CodeFile=\"WelcomeSession.aspx.vb\" Inherits=\"WelcomeSession\" %>\n<!DOCTYPE html>\n<html><head runat=\"server\"><title>Welcome - Session and Cookie<\/title><link href=\"site.css\" rel=\"stylesheet\" /><\/head><body><form id=\"form1\" runat=\"server\">\n<div class=\"wrapper\"><h2>Welcome - Session and Cookie<\/h2>\n<p>From Session: <asp:Label ID=\"lblSession\" runat=\"server\" /><\/p>\n<p>From Cookie: <asp:Label ID=\"lblCookie\" runat=\"server\" /><\/p>\n<asp:Button ID=\"btnLogout\" runat=\"server\" Text=\"Logout\" CssClass=\"action\"\n    OnClick=\"btnLogout_Click\" />\n<\/div><\/form><\/body><\/html>\n"}, {"name": "WelcomeSession.aspx.vb", "text": "Partial Class WelcomeSession\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Session(\"user\") Is Nothing Then\n            Response.Redirect(\"LoginSession.aspx\")\n            Return\n        End If\n        lblSession.Text = Server.HtmlEncode(Session(\"user\").ToString())\n        Dim cookie As HttpCookie = Request.Cookies(\"user\")\n        lblCookie.Text = If(cookie Is Nothing,\n            \"(not found)\", Server.HtmlEncode(Server.UrlDecode(cookie.Value)))\n    End Sub\n\n    Protected Sub btnLogout_Click(sender As Object, e As EventArgs)\n        Session.Clear()\n        Session.Abandon()\n        Dim expired As New HttpCookie(\"user\", \"\")\n        expired.Expires = DateTime.Now.AddDays(-1)\n        expired.HttpOnly = True\n        expired.Secure = Request.IsSecureConnection\n        Response.Cookies.Add(expired)\n        Response.Redirect(\"LoginSession.aspx\")\n    End Sub\nEnd Class\n"}, {"name": "site.css", "text": "body { margin:0; background:#f4f8fa; color:#17344a;\n    font:15px/1.55 Arial,sans-serif; }\n.wrapper { max-width:930px; margin:34px auto; padding:26px 30px;\n    border-radius:11px; box-shadow:0 3px 24px #17344a17; background:#fff; }\nh1,h2 { color:#113249; }\n.field { margin:9px 0; display:flex; gap:15px; align-items:center; }\n.field label { width:160px; font-weight:bold; }\ninput,select,textarea { padding:9px 10px; border:1px solid #b9cdd6;\n    border-radius:6px; min-width:230px; box-sizing:border-box; }\n.action { background:#0a6774; border:0; border-radius:5px;\n    color:#fff; padding:10px 16px; cursor:pointer; margin:6px 8px 6px 0; }\n.grid { border-collapse:collapse; width:100%; margin-top:20px; }\n.grid th { background:#e6f1f3; color:#133047; }\n.grid td,.grid th { border-bottom:1px solid #d6e1e7;\n    text-align:left; padding:9px; }\n.message { margin:11px 0; display:block; color:#0a6774; }\n.error { color:#b42318; }\n.portal-head { background:#123047; color:#fff; padding:16px 24px; }\n.portal-head h1 { color:#fff; margin:0; }\nnav { background:#e5f1f3; padding:12px 24px; }\nnav a { padding-right:20px; text-decoration:none; color:#0a6774; }\nfooter { color:#526475; padding:15px 24px; background:#e5f1f3; }\n@media(max-width:650px) { .wrapper{margin:8px;padding:15px}\n.field{display:block}.field label{display:block;width:auto} }\n"}], "pdf": "SHIVAM's ASSIGNMENTS/02_ASP_NET_SHIVAM_BHADORIYA.pdf"}, {"id": "WFS-01", "subject": "WFS (PHP+MySQL)", "set": "WFS Assignment 2 - PHP, MySQL, AJAX", "no": "1", "title": "Employee Management System", "question": "Employee Management System Develop a PHP and MySQL website to insert, display, update, and delete employee records containing Employee ID, Name, Email, Department, Designation, and Salary.", "qsrc": "refrence of freind/WFS index2.pdf", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_05_WFS_PHP_MySQL_Assignment_2/Code/Program_01", "folder": "code/WFS-01/", "lang": "PHP 7.4+/8 + MySQL/MariaDB (PDO), JavaScript fetch() for AJAX", "status": "verified", "evidence": "php -l clean; real run on PHP 8.2.34 + MariaDB 11.8.9 (port 3306, db.php untouched): insert/display/update/delete PASS.", "origin": "Shivam folder (unchanged copy)", "note": "Index PDF text is cut after 'Designation, and'; 'Salary' confirmed from friend's copy (DEVRAJ WFS practical assignment 2.pdf). Employee ID is AUTO_INCREMENT (not typed).", "keywords": "employee php mysql crud insert display update delete email department designation salary", "input": "", "output": "", "steps": ["XAMPP Control Panel -> Apache START, MySQL START.", "Ye poora folder copy karo: C:\\xampp\\htdocs\\WFS-01\\  (saari files ek saath, sub-folder mat banao).", "Browser: http://localhost/phpmyadmin -> koi database select MAT karo -> Import tab -> schema.sql choose -> Import (Go). Database 'employee_db' khud ban jayega.", "Browser: http://localhost/WFS-01/index.php", "db.php default: host 127.0.0.1, user root, password khali ('') = XAMPP default. MySQL password ho to db.php line 9 me password daalo."], "files": [{"name": "index.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nrequire_once __DIR__ . '/rows.php';\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $names = array_keys($values);\n        $columns = implode(', ', array_map(fn($n) => \"`$n`\", $names));\n        $holders = implode(', ', array_map(fn($n) => \":$n\", $names));\n        $table = $model['table'];\n        $stmt = db($model)->prepare(\n            \"INSERT INTO `$table` ($columns) VALUES ($holders)\"\n        );\n        $stmt->execute($values);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n    }\n}\n$search = trim((string)($_GET['q'] ?? ''));\ntry {\n    $records = fetch_rows($model, $search);\n} catch (PDOException $ex) {\n    http_response_code(500);\n    $error = 'Database connection failed. Check setup and credentials.';\n    $records = [];\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title><?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1><?= e($model['title']) ?><\/h1>\n<p>PHP · MySQL · structured records<\/p><\/header>\n<main>\n<section class=\"card\"><h2>Add new record<\/h2>\n<?php if ($error): ?><p role=\"alert\" class=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\" action=\"index.php\"><input type=\"hidden\" name=\"csrf\"\n value=\"<?= e(token()) ?>\"><div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Save record<\/button><\/div><\/form>\n<\/section>\n<section class=\"card\"><h2><?= e($model['list_label']) ?><\/h2>\n<?php if ($model['search']): ?>\n<?php if ($model['ajax']): ?>\n<div class=\"search\"><label for=\"live-search\">Live search<\/label>\n<input id=\"live-search\" autocomplete=\"off\" placeholder=\"Search records\" aria-label=\"Live search\"><\/div>\n<?php else: ?>\n<form class=\"search\" method=\"get\"><label for=\"search\">Search product / category<\/label>\n<input id=\"search\" name=\"q\" value=\"<?= e($search) ?>\">\n<div class=\"actions\"><button type=\"submit\">Search<\/button>\n<a class=\"button muted\" href=\"index.php\">Clear<\/a><\/div><\/form>\n<?php endif; endif; ?>\n<div class=\"table-wrap\"><table><thead><tr><th>ID<\/th>\n<?php foreach ($model['fields'] as $def): ?><th><?= e($def['label']) ?><\/th><?php endforeach; ?>\n<th>Actions<\/th><\/tr><\/thead><tbody id=\"data-body\">\n<?php render_rows($records, $model); ?>\n<\/tbody><\/table><\/div><\/section><\/main>\n<?php if ($model['ajax']): ?>\n<script>\nconst searchBox = document.querySelector('#live-search');\nconst tbody = document.querySelector('#data-body');\nlet waitHandle;\nsearchBox.addEventListener('input', () => {\n  clearTimeout(waitHandle);\n  waitHandle = setTimeout(async () => {\n    try {\n      const response = await fetch('search.php?q=' +\n        encodeURIComponent(searchBox.value));\n      if (!response.ok) throw new Error('Search failed');\n      tbody.innerHTML = await response.text();\n    } catch (_) {\n      tbody.innerHTML = '<tr><td>Unable to load results.<\/td><\/tr>';\n    }\n  }, 180);\n});\n<\/script>\n<?php endif; ?>\n<\/body><\/html>\n"}, {"name": "RUN_ME.md", "text": "# Employee Management System\n\nPHP 8.0+ and the **pdo_mysql** extension, MySQL 8.0+/MariaDB.\n\n1. Import `schema.sql` using phpMyAdmin or the `mysql` command line.\n2. Configure `DB_HOST`, `DB_USER`, `DB_PASSWORD` environment variables (or edit defaults in `db.php` for local development).\n3. From this program folder run `php -S 127.0.0.1:8000`.\n4. Visit http://127.0.0.1:8000/index.php and test create/edit/delete.\n5. Inspect the displayed records.\n\nDo not deploy the default local root/blank-password database configuration to production.\nThis package has passed PHP syntax checks, not database-backed runtime tests.\n"}, {"name": "common.php", "text": "<?php\ndeclare(strict_types=1);\n\nsession_start();\n$model = require __DIR__ . '/model.php';\nrequire_once __DIR__ . '/db.php';\n\nfunction e($value): string {\n    return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n}\nfunction token(): string {\n    if (empty($_SESSION['csrf'])) {\n        $_SESSION['csrf'] = bin2hex(random_bytes(32));\n    }\n    return $_SESSION['csrf'];\n}\nfunction check_token(): void {\n    if (!hash_equals(token(), (string)($_POST['csrf'] ?? ''))) {\n        http_response_code(403); exit('Invalid CSRF token.');\n    }\n}\nfunction positive_id($input): int {\n    $id = filter_var($input, FILTER_VALIDATE_INT);\n    if ($id === false || $id < 1) {\n        http_response_code(400); exit('Invalid record identifier.');\n    }\n    return $id;\n}\nfunction validate_input(array $model): array {\n    $values = [];\n    foreach ($model['fields'] as $key => $definition) {\n        $value = trim((string)($_POST[$key] ?? ''));\n        if ($value === '') {\n            throw new InvalidArgumentException($definition['label'] . ' is required.');\n        }\n        switch ($definition['type']) {\n            case 'email':\n                if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n                    throw new InvalidArgumentException('Invalid email address.');\n                }\n                break;\n            case 'number':\n                if (!is_numeric($value) || (float)$value < 0) {\n                    throw new InvalidArgumentException('Invalid amount.');\n                }\n                break;\n            case 'integer':\n                if (!ctype_digit($value)) {\n                    throw new InvalidArgumentException('Enter a non-negative integer.');\n                }\n                break;\n        }\n        if (strlen($value) > ($definition['max'] ?? 1000)) {\n            throw new InvalidArgumentException($definition['label'] . ' is too long.');\n        }\n        $values[$key] = $value;\n    }\n    return $values;\n}\nfunction fetch_rows(array $model, string $search = ''): array {\n    $table = $model['table'];\n    $order = $model['order'];\n    $sql = \"SELECT * FROM `$table`\";\n    $params = [];\n    if ($search !== '' && !empty($model['search'])) {\n        $clauses = [];\n        foreach ($model['search'] as $i => $column) {\n            $placeholder = \":q$i\";\n            $clauses[] = \"`$column` LIKE $placeholder\";\n            $params[$placeholder] = '%' . $search . '%';\n        }\n        $sql .= ' WHERE ' . implode(' OR ', $clauses);\n    }\n    $sql .= \" ORDER BY `$order` ASC\";\n    $stmt = db($model)->prepare($sql);\n    $stmt->execute($params);\n    return $stmt->fetchAll();\n}\nfunction goto_home(): void {\n    header('Location: index.php');\n    exit;\n}\n"}, {"name": "db.php", "text": "<?php\ndeclare(strict_types=1);\n\nfunction db(array $model): PDO {\n    static $db = null;\n    if ($db instanceof PDO) return $db;\n    $host = getenv('DB_HOST') ?: '127.0.0.1';\n    $user = getenv('DB_USER') ?: 'root';\n    $pass = getenv('DB_PASSWORD') ?: '';\n    $database = $model['database'];\n    $dsn = \"mysql:host=$host;dbname=$database;charset=utf8mb4\";\n    $db = new PDO($dsn, $user, $pass, [\n        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n        PDO::ATTR_EMULATE_PREPARES => false,\n    ]);\n    return $db;\n}\n"}, {"name": "delete.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nif ($_SERVER['REQUEST_METHOD'] !== 'POST') {\n    http_response_code(405); exit('POST required.');\n}\ncheck_token();\n$id = positive_id($_POST['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"DELETE FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute(['id' => $id]);\ngoto_home();\n"}, {"name": "edit.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\n$id = positive_id($_GET['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"SELECT * FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute([':id' => $id]);\n$row = $stmt->fetch();\nif (!$row) { http_response_code(404); exit('Record not found.'); }\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $set = implode(', ', array_map(fn($k) => \"`$k` = :$k\", array_keys($values)));\n        $stmt = db($model)->prepare(\"UPDATE `$table` SET $set WHERE `$pk` = :id\");\n        $stmt->execute($values + ['id' => $id]);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n        $row = array_replace($row, $_POST);\n    }\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Edit <?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1>Edit <?= e($model['title']) ?><\/h1><p>Record #<?= $id ?><\/p><\/header>\n<main><section class=\"card\"><h2>Edit record<\/h2>\n<?php if ($error): ?><p class=\"alert\" role=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\"><input type=\"hidden\" name=\"csrf\" value=\"<?= e(token()) ?>\">\n<div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><?= e($row[$key]) ?><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n value=\"<?= e($row[$key]) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Update record<\/button>\n<a href=\"index.php\" class=\"button muted\">Cancel<\/a><\/div><\/form>\n<\/section><\/main><\/body><\/html>\n"}, {"name": "model.php", "text": "<?php\nreturn [\n    'title' => 'Employee Management System',\n    'database' => 'employee_db',\n    'table' => 'employees',\n    'pk' => 'id',\n    'order' => 'id',\n    'list_label' => 'Employee List',\n    'ajax' => false,\n    'search' => [],\n    'fields' => [\n        'name' => ['label' => 'Name', 'type' => 'text', 'max' => 100],\n        'email' => ['label' => 'Email', 'type' => 'email', 'max' => 140],\n        'department' => ['label' => 'Department', 'type' => 'text', 'max' => 80],\n        'designation' => ['label' => 'Designation', 'type' => 'text', 'max' => 80],\n        'salary' => ['label' => 'Salary', 'type' => 'number', 'max' => 30],\n    ],\n];\n"}, {"name": "rows.php", "text": "<?php\nfunction render_rows(array $records, array $model): void {\n    if (!$records) {\n        echo '<tr><td colspan=\"' . (count($model['fields']) + 2) . '\">'\n            . 'No matching records.<\/td><\/tr>';\n        return;\n    }\n    foreach ($records as $row) {\n        echo '<tr><td>' . e($row[$model['pk']]) . '<\/td>';\n        foreach (array_keys($model['fields']) as $name) {\n            echo '<td>' . e($row[$name]) . '<\/td>';\n        }\n        $id = (int)$row[$model['pk']];\n        echo '<td><a href=\"edit.php?id=' . $id . '\">Edit<\/a> ';\n        echo '<form class=\"inline\" method=\"post\" action=\"delete.php\"'\n             . ' onsubmit=\"return confirm(&quot;Delete this record?&quot;)\">';\n        echo '<input type=\"hidden\" name=\"id\" value=\"' . $id . '\">';\n        echo '<input type=\"hidden\" name=\"csrf\" value=\"' . e(token()) . '\">';\n        echo '<button type=\"submit\">Delete<\/button><\/form><\/td><\/tr>';\n    }\n}\n"}, {"name": "schema.sql", "text": "CREATE DATABASE IF NOT EXISTS `employee_db` CHARACTER SET utf8mb4;\nUSE `employee_db`;\nCREATE TABLE IF NOT EXISTS `employees` (\n  `id` INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  `name` VARCHAR(100) NOT NULL,\n  `email` VARCHAR(140) NOT NULL,\n  `department` VARCHAR(80) NOT NULL,\n  `designation` VARCHAR(80) NOT NULL,\n  `salary` DECIMAL(12,2) NOT NULL CHECK (`salary` >= 0)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n"}, {"name": "style.css", "text": "* { box-sizing:border-box; }\nbody { margin:0; font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;\n  c o load results.<\/td><\/tr>';\n    }\n  }, 180);\n});\n<\/script>\n<?php endif; ?>\n<\/body><\/html>\n"}, {"name": "RUN_ME.md", "text": "# Product Management and WHERE Search\n\nPHP 8.0+ and the **pdo_mysql** extension, MySQL 8.0+/MariaDB.\n\n1. Import `schema.sql` using phpMyAdmin or the `mysql` command line.\n2. Configure `DB_HOST`, `DB_USER`, `DB_PASSWORD` environment variables (or edit defaults in `db.php` for local development).\n3. From this program folder run `php -S 127.0.0.1:8000`.\n4. Visit http://127.0.0.1:8000/index.php and test create/edit/delete.\n5. Search using the form with a product name or category.\n\nDo not deploy the default local root/blank-password database configuration to production.\nThis package has passed PHP syntax checks, not database-backed runtime tests.\n"}, {"name": "common.php", "text": "<?php\ndeclare(strict_types=1);\n\nsession_start();\n$model = require __DIR__ . '/model.php';\nrequire_once __DIR__ . '/db.php';\n\nfunction e($value): string {\n    return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n}\nfunction token(): string {\n    if (empty($_SESSION['csrf'])) {\n        $_SESSION['csrf'] = bin2hex(random_bytes(32));\n    }\n    return $_SESSION['csrf'];\n}\nfunction check_token(): void {\n    if (!hash_equals(token(), (string)($_POST['csrf'] ?? ''))) {\n        http_response_code(403); exit('Invalid CSRF token.');\n    }\n}\nfunction positive_id($input): int {\n    $id = filter_var($input, FILTER_VALIDATE_INT);\n    if ($id === false || $id < 1) {\n        http_response_code(400); exit('Invalid record identifier.');\n    }\n    return $id;\n}\nfunction validate_input(array $model): array {\n    $values = [];\n    foreach ($model['fields'] as $key => $definition) {\n        $value = trim((string)($_POST[$key] ?? ''));\n        if ($value === '') {\n            throw new InvalidArgumentException($definition['label'] . ' is required.');\n        }\n        switch ($definition['type']) {\n n;\n    }\n    foreach ($records as $row) {\n        echo '<tr><td>' . e($row[$model['pk']]) . '<\/td>';\n        foreach (array_keys($model['fields']) as $name) {\n            echo '<td>' . e($row[$name]) . '<\/td>';\n        }\n        $id = (int)$row[$model['pk']];\n        echo '<td><a href=\"edit.php?id=' . $id . '\">Edit<\/a> ';\n        echo '<form class=\"inline\" method=\"post\" action=\"delete.php\"'\n             . ' onsubmit=\"return confirm(&quot;Delete this record?&quot;)\">';\n        echo '<input type=\"hidden\" name=\"id\" value=\"' . $id . '\">';\n        echo '<input type=\"hidden\" name=\"csrf\" value=\"' . e(token()) . '\">';\n        echo '<button type=\"submit\">Delete<\/button><\/form><\/td><\/tr>';\n    }\n}\n"}, {"name": "schema.sql", "text": "CREATE DATABASE IF NOT EXISTS `product_db` CHARACTER SET utf8mb4;\nUSE `product_db`;\nCREATE TABLE IF NOT EXISTS `products` (\n  `product_id` INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  `product_name` VARCHAR(120) NOT NULL,\n  `category` VARCHAR(80) NOT NULL,\n  `price` DECIMAL(12,2) NOT NULL CHECK (`price` >= 0),\n  `stock` INT UNSIGNED NOT NULL\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n"}, {"name": "style.css", "text": "* { box-sizing:border-box; }\nbody { margin:0; font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;\n  color:#17344a; background:#f3f7f9; }\nheader { background:#123047; color:white; padding:25px max(24px,calc((100vw - 1040px)/2)); }\nheader h1 { margin:0 0 3px; font-size:27px; }\nheader p { margin:0; color:#c6d9e2; }\nmain { max-width:1040px; margin:26px auto; padding:0 18px 35px; }\n.card { background:white; border:1px solid #e1e8ed; border-radius:10px;\n  padding:22px; margin-bottom:22px; box-shadow:0 2px 10px #1230470b; }\nh2 { margin:0 0 20px; font-size:19px; }\n.fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }\n.fields label { display:block; font-weight:650; font-size:13px; margin-bottom:5px; }\ninput,textarea { display:block; width:100%;  Update existing customer information. 8. Delete customer records from the database.", "qsrc": "refrence of freind/WFS index2.pdf", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_05_WFS_PHP_MySQL_Assignment_2/Code/Program_04", "folder": "code/WFS-04/", "lang": "PHP 7.4+/8 + MySQL/MariaDB (PDO), JavaScript fetch() for AJAX", "status": "verified", "evidence": "php -l clean; real run on PHP 8.2.34 + MariaDB 11.8.9 (port 3306, db.php untouched): insert/display/update/delete, search, sort PASS.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "customer ajax search name city where order by sort update delete php mysql", "input": "", "output": "", "steps": ["XAMPP Control Panel -> Apache START, MySQL START.", "Ye poora folder copy karo: C:\\xampp\\htdocs\\WFS-04\\  (saari files ek saath, sub-folder mat banao).", "Browser: http://localhost/phpmyadmin -> koi database select MAT karo -> Import tab -> schema.sql choose -> Import (Go). Database 'customer_db' khud ban jayega.", "Browser: http://localhost/WFS-04/index.php", "db.php default: host 127.0.0.1, user root, password khali ('') = XAMPP default. MySQL password ho to db.php line 9 me password daalo."], "files": [{"name": "index.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nrequire_once __DIR__ . '/rows.php';\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $names = array_keys($values);\n        $columns = implode(', ', array_map(fn($n) => \"`$n`\", $names));\n        $holders = implode(', ', array_map(fn($n) => \":$n\", $names));\n        $table = $model['table'];\n        $stmt = db($model)->prepare(\n            \"INSERT INTO `$table` ($columns) VALUES ($holders)\"\n        );\n        $stmt->execute($values);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n    }\n}\n$search = trim((string)($_GET['q'] ?? ''));\ntry {\n    $records = fetch_rows($model, $search);\n} catch (PDOException $ex) {\n    http_response_code(500);\n    $error = 'Database connection failed. Check setup and credentials.';\n    $records = [];\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title><?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1><?= e($model['title']) ?><\/h1>\n<p>PHP · MySQL · structured records<\/p><\/header>\n<main>\n<section class=\"card\"><h2>Add new record<\/h2>\n<?php if ($error): ?><p role=\"alert\" class=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\" action=\"index.php\"><input type=\"hidden\" name=\"csrf\"\n value=\"<?= e(token()) ?>\"><div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Save record<\/button><\/div><\/form>\n<\/section>\n<section class=\"card\"><h2><?= e($model['list_label']) ?><\/h2>\n<?php if ($model['search']): ?>\n<?php if ($model['ajax']): ?>\n<div class=\"search\"><label for=\"live-search\">Live search<\/label>\n<input id=\"live-search\" autocomplete=\"off\" placeholder=\"Search records\" aria-label=\"Live search\"><\/div>\n<?php else: ?>\n<form class=\"search\" method=\"get\"><label for=\"search\">Search product / category<\/label>\n<input id=\"search\" name=\"q\" value=\"<?= e($search) ?>\">\n<div class=\"actions\"><button type=\"submit\">Search<\/button>\n<a class=\"button muted\" href=\"index.php\">Clear<\/a><\/div><\/form>\n<?php endif; endif; ?>\n<div class=\"table-wrap\"><table><thead><tr><th>ID<\/th>\n<?php foreach ($model['fields'] as $def): ?><th><?= e($def['label']) ?><\/th><?php endforeach; ?>\n<th>Actions<\/th><\/tr><\/thead><tbody id=\"data-body\">\n<?php render_rows($records, $model); ?>\n<\/tbody><\/table><\/div><\/section><\/main>\n<?php if ($model['ajax']): ?>\n<script>\nconst searchBox = document.querySelector('#live-search');\nconst tbody = document.querySelector('#data-body');\nlet waitHandle;\nsearchBox.addEventListener('input', () => {\n  clearTimeout(waitHandle);\n  waitHandle = setTimeout(async () => {\n    try {\n      const response = await fetch('search.php?q=' +\n        encodeURIComponent(searchBox.value));\n      if (!response.ok) throw new Error('Search failed');\n      tbody.innerHTML = await response.text();\n    } catch (_) {\n      tbody.innerHTML = '<tr><td>Unable to load results.<\/td><\/tr>';\n    }\n  }, 180);\n});\n<\/script>\n<?php endif; ?>\n<\/body><\/html>\n"}, {"name": "RUN_ME.md", "text": "# Customer Management with AJAX\n\nPHP 8.0+ and the **pdo_mysql** extension, MySQL 8.0+/MariaDB.\n\n1. Import `schema.sql` using phpMyAdmin or the `mysql` command line.\n2. Configure `DB_HOST`, `DB_USER`, `DB_PASSWORD` environment variables (or edit defaults in `db.php` for local development).\n3. From this program folder run `php -S 127.0.0.1:8000`.\n4. Visit http://127.0.0.1:8000/index.php and test create/edit/delete.\n5. Try typing a search term into the live AJAX search field.\n\nDo not deploy the default local root/blank-password database configuration to production.\nThis package has passed PHP syntax checks, not database-backed runtime tests.\n"}, {"name": "common.php", "text": "<?php\ndeclare(strict_types=1);\n\nsession_start();\n$model = require __DIR__ . '/model.php';\nrequire_once __DIR__ . '/db.php';\n\nfunction e($value): string {\n    return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n}\nfunction token(): string {\n    if (empty($_SESSION['csrf'])) {\n        $_SESSION['csrf'] = bin2hex(random_bytes(32));\n    }\n    return $_SESSION['csrf'];\n}\nfunction check_token(): void {\n    if (!hash_equals(token(), (string)($_POST['csrf'] ?? ''))) {\n        http_response_code(403); exit('Invalid CSRF token.');\n    }\n}\nfunction positive_id($input): int {\n    $id = filter_var($input, FILTER_VALIDATE_INT);\n    if ($id === false || $id < 1) {\n        http_response_code(400); exit('Invalid record identifier.');\n    }\n    return $id;\n}\nfunction validate_input(array $model): array {\n    $values = [];\n    foreach ($model['fields'] as $key => $definition) {\n        $value = trim((string)($_POST[$key] ?? ''));\n        if ($value === '') {\n            throw new InvalidArgumentException($definition['label'] . ' is required.');\n        }\n        switch ($definition['type']) {\n            case 'email':\n                if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n                    throw new InvalidArgumentException('Invalid email address.');\n                }\n                break;\n            case 'number':\n                if (!is_numeric($value) || (float)$value < 0) {\n                    throw new InvalidArgumentException('Invalid amount.');\n                }\n                break;\n            case 'integer':\n                if (!ctype_digit($value)) {\n                    throw new InvalidArgumentException('Enter a non-negative integer.');\n                }\n                break;\n        }\n        if (strlen($value) > ($definition['max'] ?? 1000)) {\n            throw new InvalidArgumentException($definition['label'] . ' is too long.');\n        }\n        $values[$key] = $value;\n    }\n    return $values;\n}\nfunction fetch_rows(array $model, string $search = ''): array {\n    $table = $model['table'];\n    $order = $model['order'];\n    $sql = \"SELECT * FROM `$table`\";\n    $params = [];\n    if ($search !== '' && !empty($model['search'])) {\n        $clauses = [];\n        foreach ($model['search'] as $i => $column) {\n            $placeholder = \":q$i\";\n            $clauses[] = \"`$column` LIKE $placeholder\";\n            $params[$placeholder] = '%' . $search . '%';\n        }\n        $sql .= ' WHERE ' . implode(' OR ', $clauses);\n    }\n    $sql .= \" ORDER BY `$order` ASC\";\n    $stmt = db($model)->prepare($sql);\n    $stmt->execute($params);\n    return $stmt->fetchAll();\n}\nfunction goto_home(): void {\n    header('Location: index.php');\n    exit;\n}\n"}, {"name": "db.php", "text": "<?php\ndeclare(strict_types=1);\n\nfunction db(array $model): PDO {\n    static $db = null;\n    if ($db instanceof PDO) return $db;\n    $host = getenv('DB_HOST') ?: '127.0.0.1';\n    $user = getenv('DB_USER') ?: 'root';\n    $pass = getenv('DB_PASSWORD') ?: '';\n    $database = $model['database'];\n    $dsn = \"mysql:host=$host;dbname=$database;charset=utf8mb4\";\n    $db = new PDO($dsn, $user, $pass, [\n        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n        PDO::ATTR_EMULATE_PREPARES => false,\n    ]);\n    return $db;\n}\n"}, {"name": "delete.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nif ($_SERVER['REQUEST_METHOD'] !== 'POST') {\n    http_response_code(405); exit('POST required.');\n}\ncheck_token();\n$id = positive_id($_POST['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"DELETE FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute(['id' => $id]);\ngoto_home();\n"}, {"name": "edit.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\n$id = positive_id($_GET['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"SELECT * FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute([':id' => $id]);\n$row = $stmt->fetch();\nif (!$row) { http_response_code(404); exit('Record not found.'); }\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $set = implode(', ', array_map(fn($k) => \"`$k` = :$k\", array_keys($values)));\n        $stmt = db($model)->prepare(\"UPDATE `$table` SET $set WHERE `$pk` = :id\");\n        $stmt->execute($values + ['id' => $id]);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n        $row = array_replace($row, $_POST);\n    }\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Edit <?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1>Edit <?= e($model['title']) ?><\/h1><p>Record #<?= $id ?><\/p><\/header>\n<main><section class=\"card\"><h2>Edit record<\/h2>\n<?php if ($error): ?><p class=\"alert\" role=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\"><input type=\"hidden\" name=\"csrf\" value=\"<?= e(token()) ?>\">\n<div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><?= e($row[$key]) ?><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n value=\"<?= e($row[$key]) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Update record<\/button>\n<a href=\"index.php\" class=\"button muted\">Cancel<\/a><\/div><\/form>\n<\/section><\/main><\/body><\/html>\n"}, {"name": "model.php", "text": "<?php\nreturn [\n    'title' => 'Customer Management with AJAX',\n    'database' => 'customer_db',\n    'table' => 'customers',\n    'pk' => 'customer_id',\n    'order' => 'name',\n    'list_label' => 'Customer List',\n    'ajax' => true,\n    'search' => ['name', 'city'],\n    'fields' => [\n        'name' => ['label' => 'Name', 'type' => 'text', 'max' => 100],\n        'email' => ['label' => 'Email', 'type' => 'email', 'max' => 140],\n        'phone' => ['label' => 'Phone', 'type' => 'text', 'max' => 25],\n        'city' => ['label' => 'City', 'type' => 'text', 'max' => 80],\n    ],\n];\n"}, {"name": "rows.php", "text": "<?php\nfunction render_rows(array $records, array $model): void {\n    if (!$records) {\n        echo '<tr><td colspan=\"' . (count($model['fields']) + 2) . '\">'\n            . 'No matching records.<\/td><\/tr>';\n        return;\n    }\n    foreach ($records as $row) {\n        echo '<tr><td>' . e($row[$model['pk']]) . '<\/td>';\n        foreach (array_keys($model['fields']) as $name) {\n            echo '<td>' . e($row[$name]) . '<\/td>';\n        }\n        $id = (int)$row[$model['pk']];\n        echo '<td><a href=\"edit.php?id=' . $id . '\">Edit<\/a> ';\n        echo '<form class=\"inline\" method=\"post\" action=\"delete.php\"'\n             . ' onsubmit=\"return confirm(&quot;Delete this record?&quot;)\">';\n        echo '<input type=\"hidden\" name=\"id\" value=\"' . $id . '\">';\n        echo '<input type=\"hidden\" name=\"csrf\" value=\"' . e(token()) . '\">';\n        echo '<button type=\"submit\">Delete<\/button><\/form><\/td><\/tr>';\n    }\n}\n"}, {"name": "schema.sql", "text": "CREATE DATABASE IF NOT EXISTS `customer_db` CHARACTER SET utf8mb4;\nUSE `customer_db`;\nCREATE TABLE IF NOT EXISTS `customers` (\n  `customer_id` INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  `name` VARCHAR(100) NOT NULL,\n  `email` VARCHAR(140) NOT NULL,\n  `phone` VARCHAR(25) NOT NULL,\n  `city` VARCHAR(80) NOT NULL\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n"}, {"name": "search.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nrequire_once __DIR__ . '/rows.php';\nheader('Content-Type: text/html; charset=utf-8');\ntry {\n    $q = trim((string)($_GET['q'] ?? ''));\n    render_rows(fetch_rows($model, $q), $model);\n} catch (PDOException $ex) {\n    http_response_code(500);\n    echo '<tr><td>Search unavailable.<\/td><\/tr>';\n}\n"}, {"name": "style.css", "text": "* { box-sizing:border-box; }\nbody { margin:0; font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;\n  color:#17344a; background:#f3f7f9; }\nheader { background:#123047; color:white; padding:25px max(24px,calc((100vw - 1040px)/2)); }\nheader h1 { margin:0 0 3px; font-size:27px; }\nheader p { margin:0; color:#c6d9e2; }\nmain { max-width:1040px; margin:26px auto; padding:0 18px 35px; }\n.card { background:white; border:1px solid #e1e8ed; border-radius:10px;\n  padding:22px; margin-bottom:22px; box-shadow:0 2px 10px #1230470b; }\nh2 { margin:0 0 20px; font-size:19px; }\n.fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }\n.fields label { display:block; font-weight:650; font-size:13px; margin-bottom:5px; }\ninput,textarea { display:block; width:100%; padding:11px; border-radius:6px;\n  border:1px solid #b9c8d0; background:#fff; font:inherit; }\ninput:focus,textarea:focus,button:focus,a:focus-visible {\n  outline:2px solid #137d8c; outline-offset:2px; }\ntextarea { min-height:90px; resize:vertical; }\nbutton,.button { display:inline-block; background:#0a6774; color:white;\n  padding:9px 15px; border:0; border-radius:6px; font:inherit;\n  font-weight:600; cursor:pointer; text-decoration:none; }\n.button.muted { color:#17344a; background:#e6edf0; }\n.actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:19px; }\n.alert { color:#933; background:#fff2f0; border-left:3px solid #c43c3c;\n  padding:10px 14px; margin-bottom:15px; }\n.table-wrap { overflow-x:auto; }\ntable { width:100%; border-collapse:collapse; }\nth { background:#e4f0f3; color:#17344a; text-align:left; }\nth,td { padding:11px; border-bottom:1px solid #dce6e9; vertical-align:top; }\n.inline { display:inline; }\n.inline button { background:#fff4f2; color:#9c2318; padding:5px 9px; }\na { color:#0a6774; font-weight:600; }\n.search { max-width:450px; margin-bottom:16px; }\nsmall { color:#627785; }\n@media(max-width:680px){ .fields {grid-template-columns:1fr;} }\n"}], "pdf": "SHIVAM's ASSIGNMENTS/03_PHP_WFS_SHIVAM_BHADORIYA.pdf"}, {"id": "WFS-05", "subject": "WFS (PHP+MySQL)", "set": "WFS Assignment 2 - PHP, MySQL, AJAX", "no": "5", "title": "Mobile Shop Management (AJAX search by brand, ORDER BY price)", "question": "Mobile Shop Management System Create a website using PHP, MySQL, and AJAX to manage mobile phone records in a database. Implement the following features: 1. Create a database and a table to store mobile phone details. 2. Insert new mobile phone records into the database. 3. Display all mobile phone records on the website. 4. Implement AJAX-based search to retrieve matching mobile phone records from the PHP backend. 5. Search mobile phones by brand using the WHERE clause. 6. Sort mobile phone records by price using the ORDER BY clause. 7. Update existing mobile phone information. 8. Delete mobile phone records from the database.", "qsrc": "refrence of freind/WFS index2.pdf", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_05_WFS_PHP_MySQL_Assignment_2/Code/Program_05", "folder": "code/WFS-05/", "lang": "PHP 7.4+/8 + MySQL/MariaDB (PDO), JavaScript fetch() for AJAX", "status": "verified", "evidence": "php -l clean; real run on PHP 8.2.34 + MariaDB 11.8.9 (port 3306, db.php untouched): insert/display/update/delete, search, sort PASS.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "mobile phone shop ajax search brand price order by sort where php mysql", "input": "", "output": "", "steps": ["XAMPP Control Panel -> Apache START, MySQL START.", "Ye poora folder copy karo: C:\\xampp\\htdocs\\WFS-05\\  (saari files ek saath, sub-folder mat banao).", "Browser: http://localhost/phpmyadmin -> koi database select MAT karo -> Import tab -> schema.sql choose -> Import (Go). Database 'mobile_db' khud ban jayega.", "Browser: http://localhost/WFS-05/index.php", "db.php default: host 127.0.0.1, user root, password khali ('') = XAMPP default. MySQL password ho to db.php line 9 me password daalo."], "files": [{"name": "index.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nrequire_once __DIR__ . '/rows.php';\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $names = array_keys($values);\n        $columns = implode(', ', array_map(fn($n) => \"`$n`\", $names));\n        $holders = implode(', ', array_map(fn($n) => \":$n\", $names));\n        $table = $model['table'];\n        $stmt = db($model)->prepare(\n            \"INSERT INTO `$table` ($columns) VALUES ($holders)\"\n        );\n        $stmt->execute($values);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n    }\n}\n$search = trim((string)($_GET['q'] ?? ''));\ntry {\n    $records = fetch_rows($model, $search);\n} catch (PDOException $ex) {\n    http_response_code(500);\n    $error = 'Database connection failed. Check setup and credentials.';\n    $records = [];\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title><?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1><?= e($model['title']) ?><\/h1>\n<p>PHP · MySQL · structured records<\/p><\/header>\n<main>\n<section class=\"card\"><h2>Add new record<\/h2>\n<?php if ($error): ?><p role=\"alert\" class=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\" action=\"index.php\"><input type=\"hidden\" name=\"csrf\"\n value=\"<?= e(token()) ?>\"><div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Save record<\/button><\/div><\/form>\n<\/section>\n<section class=\"card\"><h2><?= e($model['list_label']) ?><\/h2>\n<?php if ($model['search']): ?>\n<?php if ($model['ajax']): ?>\n<div class=\"search\"><label for=\"live-search\">Live search<\/label>\n<input id=\"live-search\" autocomplete=\"off\" placeholder=\"Search records\" aria-label=\"Live search\"><\/div>\n<?php else: ?>\n<form class=\"search\" method=\"get\"><label for=\"search\">Search product / category<\/label>\n<input id=\"search\" name=\"q\" value=\"<?= e($search) ?>\">\n<div class=\"actions\"><button type=\"submit\">Search<\/button>\n<a class=\"button muted\" href=\"index.php\">Clear<\/a><\/div><\/form>\n<?php endif; endif; ?>\n<div class=\"table-wrap\"><table><thead><tr><th>ID<\/th>\n<?php foreach ($model['fields'] as $def): ?><th><?= e($def['label']) ?><\/th><?php endforeach; ?>\n<th>Actions<\/th><\/tr><\/thead><tbody id=\"data-body\">\n<?php render_rows($records, $model); ?>\n<\/tbody><\/table><\/div><\/section><\/main>\n<?php if ($model['ajax']): ?>\n<script>\nconst searchBox = document.querySelector('#live-search');\nconst tbody = document.querySelector('#data-body');\nlet waitHandle;\nsearchBox.addEventListener('input', () => {\n  clearTimeout(waitHandle);\n  waitHandle = setTimeout(async () => {\n    try {\n      const response = await fetch('search.php?q=' +\n        encodeURIComponent(searchBox.value));\n      if (!response.ok) throw new Error('Search failed');\n      tbody.innerHTML = await response.text();\n    } catch (_) {\n      tbody.innerHTML = '<tr><td>Unable to load results.<\/td><\/tr>';\n    }\n  }, 180);\n});\n<\/script>\n<?php endif; ?>\n<\/body><\/html>\n"}, {"name": "RUN_ME.md", "text": "# Mobile Shop Management with AJAX\n\nPHP 8.0+ and the **pdo_mysql** extension, MySQL 8.0+/MariaDB.\n\n1. Import `schema.sql` using phpMyAdmin or the `mysql` command line.\n2. Configure `DB_HOST`, `DB_USER`, `DB_PASSWORD` environment variables (or edit defaults in `db.php` for local development).\n3. From this program folder run `php -S 127.0.0.1:8000`.\n4. Visit http://127.0.0.1:8000/index.php and test create/edit/delete.\n5. Try typing a search term into the live AJAX search field.\n\nDo not deploy the default local root/blank-password database configuration to production.\nThis package has passed PHP syntax checks, not database-backed runtime tests.\n"}, {"name": "common.php", "text": "<?php\ndeclare(strict_types=1);\n\nsession_start();\n$model = require __DIR__ . '/model.php';\nrequire_once __DIR__ . '/db.php';\n\nfunction e($value): string {\n    return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n}\nfunction token(): string {\n    if (empty($_SESSION['csrf'])) {\n        $_SESSION['csrf'] = bin2hex(random_bytes(32));\n    }\n    return $_SESSION['csrf'];\n}\nfunction check_token(): void {\n    if (!hash_equals(token(), (string)($_POST['csrf'] ?? ''))) {\n        http_response_code(403); exit('Invalid CSRF token.');\n    }\n}\nfunction positive_id($input): int {\n    $id = filter_var($input, FILTER_VALIDATE_INT);\n    if ($id === false || $id < 1) {\n        http_response_code(400); exit('Invalid record identifier.');\n    }\n    return $id;\n}\nfunction validate_input(array $model): array {\n    $values = [];\n    foreach ($model['fields'] as $key => $definition) {\n        $value = trim((string)($_POST[$key] ?? ''));\n        if ($value === '') {\n            throw new InvalidArgumentException($definition['label'] . ' is required.');\n        }\n        switch ($definition['type']) {\n            case 'email':\n                if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n                    throw new InvalidArgumentException('Invalid email address.');\n                }\n                break;\n            case 'number':\n                if (!is_numeric($value) || (float)$value < 0) {\n                    throw new InvalidArgumentException('Invalid amount.');\n                }\n                break;\n            case 'integer':\n                if (!ctype_digit($value)) {\n                    throw new InvalidArgumentException('Enter a non-negative integer.');\n                }\n                break;\n        }\n        if (strlen($value) > ($definition['max'] ?? 1000)) {\n            throw new InvalidArgumentException($definition['label'] . ' is too long.');\n        }\n        $values[$key] = $value;\n    }\n    return $values;\n}\nfunction fetch_rows(array $model, string $search = ''): array {\n    $table = $model['table'];\n    $order = $model['order'];\n    $sql = \"SELECT * FROM `$table`\";\n    $params = [];\n    if ($search !== '' && !empty($model['search'])) {\n        $clauses = [];\n        foreach ($model['search'] as $i => $column) {\n            $placeholder = \":q$i\";\n            $clauses[] = \"`$column` LIKE $placeholder\";\n            $params[$placeholder] = '%' . $search . '%';\n        }\n        $sql .= ' WHERE ' . implode(' OR ', $clauses);\n    }\n    $sql .= \" ORDER BY `$order` ASC\";\n    $stmt = db($model)->prepare($sql);\n    $stmt->execute($params);\n    return $stmt->fetchAll();\n}\nfunction goto_home(): void {\n    header('Location: index.php');\n    exit;\n}\n"}, {"name": "db.php", "text": "<?php\ndeclare(strict_types=1);\n\nfunction db(array $model): PDO {\n    static $db = null;\n    if ($db instanceof PDO) return $db;\n    $host = getenv('DB_HOST') ?: '127.0.0.1';\n    $user = getenv('DB_USER') ?: 'root';\n    $pass = getenv('DB_PASSWORD') ?: '';\n    $database = $model['database'];\n    $dsn = \"mysql:host=$host;dbname=$database;charset=utf8mb4\";\n    $db = new PDO($dsn, $user, $pass, [\n        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n        PDO::ATTR_EMULATE_PREPARES => false,\n    ]);\n    return $db;\n}\n"}, {"name": "delete.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nif ($_SERVER['REQUEST_METHOD'] !== 'POST') {\n    http_response_code(405); exit('POST required.');\n}\ncheck_token();\n$id = positive_id($_POST['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"DELETE FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute(['id' => $id]);\ngoto_home();\n"}, {"name": "edit.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\n$id = positive_id($_GET['id'] ?? null);\n$table = $model['table'];\n$pk = $model['pk'];\n$stmt = db($model)->prepare(\"SELECT * FROM `$table` WHERE `$pk` = :id\");\n$stmt->execute([':id' => $id]);\n$row = $stmt->fetch();\nif (!$row) { http_response_code(404); exit('Record not found.'); }\n$error = '';\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    check_token();\n    try {\n        $values = validate_input($model);\n        $set = implode(', ', array_map(fn($k) => \"`$k` = :$k\", array_keys($values)));\n        $stmt = db($model)->prepare(\"UPDATE `$table` SET $set WHERE `$pk` = :id\");\n        $stmt->execute($values + ['id' => $id]);\n        goto_home();\n    } catch (InvalidArgumentException $ex) {\n        $error = $ex->getMessage();\n        $row = array_replace($row, $_POST);\n    }\n}\n?>\n<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Edit <?= e($model['title']) ?><\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head><body>\n<header><h1>Edit <?= e($model['title']) ?><\/h1><p>Record #<?= $id ?><\/p><\/header>\n<main><section class=\"card\"><h2>Edit record<\/h2>\n<?php if ($error): ?><p class=\"alert\" role=\"alert\"><?= e($error) ?><\/p><?php endif; ?>\n<form method=\"post\"><input type=\"hidden\" name=\"csrf\" value=\"<?= e(token()) ?>\">\n<div class=\"fields\">\n<?php foreach ($model['fields'] as $key => $def): ?>\n<div><label for=\"f_<?= e($key) ?>\"><?= e($def['label']) ?><\/label>\n<?php if ($def['type'] === 'textarea'): ?>\n<textarea required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"><?= e($row[$key]) ?><\/textarea>\n<?php else: ?>\n<input required id=\"f_<?= e($key) ?>\" name=\"<?= e($key) ?>\"\n value=\"<?= e($row[$key]) ?>\"\n type=\"<?= e($def['type'] === 'integer' ? 'number' :\n   ($def['type'] === 'number' ? 'number' : $def['type'])) ?>\"\n <?= in_array($def['type'], ['number','integer'], true)\n      ? 'min=\"0\" step=\"' . ($def['type'] === 'integer' ? '1' : '0.01') . '\"' : '' ?>>\n<?php endif; ?><\/div>\n<?php endforeach; ?><\/div><div class=\"actions\">\n<button type=\"submit\">Update record<\/button>\n<a href=\"index.php\" class=\"button muted\">Cancel<\/a><\/div><\/form>\n<\/section><\/main><\/body><\/html>\n"}, {"name": "model.php", "text": "<?php\nreturn [\n    'title' => 'Mobile Shop Management with AJAX',\n    'database' => 'mobile_db',\n    'table' => 'mobiles',\n    'pk' => 'mobile_id',\n    'order' => 'price',\n    'list_label' => 'Mobile Stock List',\n    'ajax' => true,\n    'search' => ['brand', 'model'],\n    'fields' => [\n        'brand' => ['label' => 'Brand', 'type' => 'text', 'max' => 80],\n        'model' => ['label' => 'Model', 'type' => 'text', 'max' => 120],\n        'price' => ['label' => 'Price', 'type' => 'number', 'max' => 30],\n        'stock' => ['label' => 'Stock', 'type' => 'integer', 'max' => 20],\n    ],\n];\n"}, {"name": "rows.php", "text": "<?php\nfunction render_rows(array $records, array $model): void {\n    if (!$records) {\n        echo '<tr><td colspan=\"' . (count($model['fields']) + 2) . '\">'\n            . 'No matching records.<\/td><\/tr>';\n        return;\n    }\n    foreach ($records as $row) {\n        echo '<tr><td>' . e($row[$model['pk']]) . '<\/td>';\n        foreach (array_keys($model['fields']) as $name) {\n            echo '<td>' . e($row[$name]) . '<\/td>';\n        }\n        $id = (int)$row[$model['pk']];\n        echo '<td><a href=\"edit.php?id=' . $id . '\">Edit<\/a> ';\n        echo '<form class=\"inline\" method=\"post\" action=\"delete.php\"'\n             . ' onsubmit=\"return confirm(&quot;Delete this record?&quot;)\">';\n        echo '<input type=\"hidden\" name=\"id\" value=\"' . $id . '\">';\n        echo '<input type=\"hidden\" name=\"csrf\" value=\"' . e(token()) . '\">';\n        echo '<button type=\"submit\">Delete<\/button><\/form><\/td><\/tr>';\n    }\n}\n"}, {"name": "schema.sql", "text": "CREATE DATABASE IF NOT EXISTS `mobile_db` CHARACTER SET utf8mb4;\nUSE `mobile_db`;\nCREATE TABLE IF NOT EXISTS `mobiles` (\n  `mobile_id` INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  `brand` VARCHAR(80) NOT NULL,\n  `model` VARCHAR(120) NOT NULL,\n  `price` DECIMAL(12,2) NOT NULL CHECK (`price` >= 0),\n  `stock` INT UNSIGNED NOT NULL\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n"}, {"name": "search.php", "text": "<?php\nrequire_once __DIR__ . '/common.php';\nrequire_once __DIR__ . '/rows.php';\nheader('Content-Type: text/html; charset=utf-8');\ntry {\n    $q = trim((string)($_GET['q'] ?? ''));\n    render_rows(fetch_rows($model, $q), $model);\n} catch (PDOException $ex) {\n    http_response_code(500);\n    echo '<tr><td>Search unavailable.< (function(){

    redirect:"redirect",cookies:"cookie",sessions:"session",validation:"validator",validators:"validator",
    masterpage:"master",grid:"gridview",datagrid:"gridview",concat:"merge",combine:"merge",join:"merge",

    pahada:"table",oop:"oop",ajax:"ajax",sort:"sort",sorting:"sort",order:"order",prime:"prime",primes:"prime"};
  items.forEach(function(it){
    it._hay = (it.id+" "+it.title+" "+it.question+" "+it.keywords+" "+it.set+" "+it.subject+" "+
      it.files.map(function(f){return f.name;}).join(" ")).toLowerCase();
    // number tokens: "a2 5", "q05", "c07", "prog4", "program 4"
    var n = (it.id.match(/(\d+)$/)||[])[1];
    var extra = [];
    if (n) { var k = parseInt(n,10); extra.push("#"+k);
      if (it.id.indexOf("UX-A2")===0) extra.push("q"+n,"q"+k);
      if (it.id.indexOf("UX-A3")===0) extra.push("c"+n,"c"+k);
      if (it.id.indexOf("ASP-A2")===0) extra.push("prog"+k);
    }
    it._num = extra.join(" ");
  });
  function tokens(q){
    return q.toLowerCase().replace(/[^a-z0-9#.\-+ ]/g," ").split(/\s+/).filter(Boolean);
  }
  function match(it, q){
    var t = tokens(q); if(!t.length) return 1;
    // Pattern "a2 5" / "assignment 3 7" / "asp 4": set token + number
    var num = null, rest = [];
    t.forEach(function(x){ if(/^\d+$/.test(x)) num = parseInt(x,10); else rest.push(x); });
    var score = 0;
    for (var i=0;i<rest.length;i++){
      var w = rest[i], a = ALIAS[w] || w;
      if (it.id.toLowerCase()===w) score += 50;
      else if ((" "+it._num+" ").indexOf(" "+w+" ")>=0) score += 40;
      else if (it._hay.indexOf(w)>=0 || it._hay.indexOf(a)>=0) score += (it.title.toLowerCase().indexOf(a)>=0?6:3);
      else if (w.length>3 && it._hay.indexOf(w.slice(0,w.length-1))>=0) score += 1; // partial / plural
      else if (/^(a2|a3|p1|p2|b|asp|wfs|php|unix|shell)$/.test(w)) score += 0;
      else return 0;
    }
    if (num!==null){
      var n = (it.id.match(/(\d+)$/)||[])[1];
      if (n && parseInt(n,10)===num) score += 10; else if (!rest.length) return 0; else if (it._hay.indexOf(String(num))<0) return 0;
      // set tokens narrow the number search

      if (/\ba2\b/.test(setTok) && it.id.indexOf("A2-")<0) return 0;
      if (/\ba3\b/.test(setTok) && it.id.indexOf("A3-")<0) return 0;
      if (/\bp1\b/.test(setTok) && it.id.indexOf("P1-")<0) return 0;
      if (/\bp2\b/.test(setTok) && it.id.indexOf("P2-")<0) return 0;
      if (/\bwfs\b|\bphp\b/.test(setTok) && it.subject.indexOf("WFS")<0) return 0;
      if (/\basp\b/.test(setTok) && it.subject!=="ASP.NET") return 0;

  }
  function render(){

  }
  function open(k){

    var el = document.querySelector('.item[data-k="'+k+'"]'); if (el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
