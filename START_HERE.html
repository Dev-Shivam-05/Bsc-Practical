<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practical Exam Companion</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#5d6676;--line:#d9dde4;--acc:#1f5fbf;--ok:#16794a;--warn:#a15c00;--bad:#b3261e;--code:#0f1420;--codeink:#e6e9ef;--sel:#e8f0fc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1a1f27;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2c3340;--acc:#6ea2ff;--ok:#4cc38a;--warn:#e0a84a;--bad:#ff7b72;--code:#0b0e14;--codeink:#e6e9ef;--sel:#22314a}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0 0 8px}
h1 small{color:var(--muted);font-weight:400}
#q{width:100%;font-size:18px;padding:10px 12px;border:2px solid var(--acc);border-radius:8px;background:var(--panel);color:var(--ink)}
.filters{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.filters button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
.filters button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:0;min-height:calc(100vh - 120px)}
#list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 120px)}
.item{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.cur{background:var(--sel)}
.item .id{font-weight:700;font-family:Consolas,monospace}
.item .t{display:block}
.item .meta{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor;text-transform:uppercase}
.s-verified{color:var(--ok)}.s-ambiguous,.s-untested,.s-compiled-only{color:var(--warn)}.s-blocked,.s-missing,.s-failed{color:var(--bad)}
#detail{padding:14px 18px;overflow:auto;max-height:calc(100vh - 120px)}
#detail h2{margin:0 0 4px;font-size:20px}
.qbox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 12px;border-radius:6px;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
.kv b{color:var(--ink)}
.note{border-left:4px solid var(--warn);padding:8px 12px;background:var(--panel);border-radius:6px;margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 9px;border-radius:6px 6px 0 0;cursor:pointer;font-family:Consolas,monospace;font-size:13px}
.tabs button.on{background:var(--code);color:var(--codeink)}
.codebar{display:flex;gap:8px;align-items:center;background:var(--code);color:var(--codeink);padding:6px 10px;border-radius:0 6px 0 0;font-family:Consolas,monospace;font-size:13px}
.codebar .sp{flex:1}
pre{margin:0;background:var(--code);color:var(--codeink);padding:12px;overflow:auto;border-radius:0 0 6px 6px;font:13.5px/1.5 Consolas,"Courier New",monospace;white-space:pre;user-select:text}
pre.out{border-radius:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
ol.steps li{margin:4px 0}
code{font-family:Consolas,monospace;background:var(--sel);padding:0 3px;border-radius:3px}
.msg{color:var(--ok);font-weight:600}
textarea.copyfb{width:100%;height:220px;font:13px Consolas,monospace}
#check{margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:6px;display:none}
#check table{border-collapse:collapse;width:100%}#check td{border-bottom:1px solid var(--line);padding:3px 6px}
@media (max-width:760px){main{grid-template-columns:1fr}#list{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}#detail{max-height:none}}
</style>
</head>

 q11.sh  phir  ./q11.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q11.sh naam se save karo (Save as type: All Files), phir bash q11.sh"], "files": [{"name": "q11.sh", "text": "#!/usr/bin/env bash\nread -r -p \"Enter a non-negative integer: \" n\n[[ $n =~ ^[0-9]+$ ]] || { echo \"Invalid integer.\"; exit 1; }\nsum=0\nwhile ((n > 0)); do\n  sum=$((sum + n % 10))\n  n=$((n / 10))\ndone\necho \"Sum of digits: $sum\"\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A2-12", "subject": "UNIX", "set": "UNIX Assignment 2 - Shell Programming", "no": "12", "title": "Menu-driven calculator (case)", "question": "Write a menu-driven shell script using case to perform addition, subtraction, multiplication, division, modulus, and exit operations.", "qsrc": "refrence of freind/ass-2_unix_devraj-1.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_12", "folder": "code/UX-A2-12/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "menu driven calculator case esac switch add subtract multiply divide modulus exit", "input": "3 / 12 45 / 6", "output": "\n1. Add  2. Subtract  3. Multiply  4. Divide\n5. Modulus  6. Exit\nResult: 540\n\n1. Add  2. Subtract  3. Multiply  4. Divide\n5. Modulus  6. Exit\nGoodbye", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q12.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q12.sh   (HAMESHA 'bash' se chalao. 'sh q12.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q12.sh  phir  ./q12.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q12.sh naam se save karo (Save as type: All Files), phir bash q12.sh"], "files": [{"name": "q12.sh", "text": "#!/usr/bin/env bash\nwhile true; do\n  printf '\\n1. Add  2. Subtract  3. Multiply  4. Divide\\n'\n  printf '5. Modulus  6. Exit\\n'\n  read -r -p \"Choose 1-6: \" choice\n  case \"$choice\" in\n    6) echo \"Goodbye\"; break ;;\n    1|2|3|4|5) ;;\n    *) echo \"Invalid choice\"; continue ;;\n  esac\n  read -r -p \"Enter two integers: \" a b\n  if ! [[ $a =~ ^-?[0-9]+$ && $b =~ ^-?[0-9]+$ ]]; then\n    echo \"Invalid integer input\"; continue\n  fi\n  if [[ $choice == 4 || $choice == 5 ]] && ((b == 0)); then\n    echo \"Cannot use zero as divisor\"; continue\n  fi\n  case \"$choice\" in\n    1) answer=$((a+b)) ;; 2) answer=$((a-b)) ;;\n    3) answer=$((a*b)) ;; 4) answer=$((a/b)) ;;\n    5) answer=$((a%b)) ;;\n  esac\n  echo \"Result: $answer\"\ndone\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A2-13", "subject": "UNIX", "set": "UNIX Assignment 2 - Shell Programming", "no": "13", "title": "String operations", "question": "Write a shell script to accept a string and perform the following operations: Find string length; Compare two strings; Check whether the string is empty; Display the string in reverse.", "qsrc": "refrence of freind/ass-2_unix_devraj-1.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_13", "folder": "code/UX-A2-13/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "string length compare empty reverse string operations", "input": "zaid / hello", "output": "Length: 4\nStrings are different\nFirst string is not empty\nReverse: diaz", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q13.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q13.sh   (HAMESHA 'bash' se chalao. 'sh q13.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q13.sh  phir  ./q13.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q13.sh naam se save karo (Save as type: All Files), phir bash q13.sh"], "files": [{"name": "q13.sh", "text": "#!/usr/bin/env bash\nread -r -p \"Enter a string: \" first\nread -r -p \"Enter a second string: \" second\nprintf 'Length: %d\\n' \"${#first}\"\nif [[ $first == \"$second\" ]]; then\n  echo \"Strings are equal\"\nelse\n  echo \"Strings are different\"\nfi\nif [[ -z $first ]]; then echo \"First string is empty\";\nelse echo \"First string is not empty\"; fi\nreverse=''\nfor ((i=${#first}-1; i>=0; i--)); do\n  reverse+=${first:i:1}\ndone\nprintf 'Reverse: %s\\n' \"$reverse\"\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A2-14", "subject": "UNIX", "set": "UNIX Assignment 2 - Shell Programming", "no": "14", "title": "File handling (exists / type / permissions)", "question": "Write a shell script to accept a filename and check whether: The file exists; It is a regular file or directory; It has read, write, and execute permissions.", "qsrc": "refrence of freind/ass-2_unix_devraj-1.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_14", "folder": "code/UX-A2-14/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "file exists regular directory read write execute permission test -e -f -d -r -w -x", "input": "q14.sh", "output": "Path exists\nRegular file\nread permission: yes\nwrite permission: yes\nexecute permission: yes", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q14.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q14.sh   (HAMESHA 'bash' se chalao. 'sh q14.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q14.sh  phir  ./q14.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q14.sh naam se save karo (Save as type: All Files), phir bash q14.sh"], "files": [{"name": "q14.sh", "text": "#!/usr/bin/env bash\nread -r -p \"Enter path: \" path\nif [[ ! -e $path ]]; then echo \"Path does not exist\"; exit 0; fi\necho \"Path exists\"\nif [[ -f $path ]]; then echo \"Regular file\";\nelif [[ -d $path ]]; then echo \"Directory\";\nelse echo \"Other file type\"; fi\nfor mode in read write execute; do\n  case \"$mode\" in\n    read)    testflag=-r ;; write) testflag=-w ;;\n    execute) testflag=-x ;;\n  esac\n  if test \"$testflag\" \"$path\"; then\n    echo \"$mode permission: yes\"\n  else\n    echo \"$mode permission: no\"\n  fi\ndone\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A2-15", "subject": "UNIX", "set": "UNIX Assignment 2 - Shell Programming", "no": "15", "title": "User-defined function (factorial)", "question": "Write a shell script using a user-defined function to calculate the factorial, sum of digits, or prime number of a given number.", "qsrc": "refrence of freind/ass-2_unix_devraj-1.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_15", "folder": "code/UX-A2-15/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "function user defined factorial sum of digits prime", "input": "10", "output": "Factorial of 10 = 3628800", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q15.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q15.sh   (HAMESHA 'bash' se chalao. 'sh q15.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q15.sh  phir  ./q15.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q15.sh naam se save karo (Save as type: All Files), phir bash q15.sh"], "files": [{"name": "q15.sh", "text": "#!/usr/bin/env bash\nfactorial() {\n  local n=$1 result=1 i\n  if ! [[ $n =~ ^[0-9]+$ ]]; then\n    echo \"Factorial requires a non-negative integer\"; return 1\n  fi\n  for ((i=2; i<=n; i++)); do ((result *= i)); done\n  printf 'Factorial of %d = %d\\n' \"$n\" \"$result\"\n}\nread -r -p \"Enter a non-negative integer: \" value\nfactorial \"$value\"\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A3-01", "subject": "UNIX", "set": "UNIX Assignment 3 - File Processing Utilities", "no": "1", "title": "Splitting files (split)", "question": "Create a text file containing at least 20 lines and use the split command to divide it into smaller files. Display the generated files.", "qsrc": "refrence of freind/DEVRAJ_3.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_02_UNIX_File_Utilities_Assignment_3/Code/Program_01", "folder": "code/UX-A3-01/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "split splitting file 20 lines smaller files part", "input": "", "output": "Generated files:\npart_aa\npart_ab\npart_ac\npart_ad\nAll contents in order:\nThis is line 1\nThis is line 2\nThis is line 3\nThis is line 4\nThis is line 5\nThis is line 6\nThis is line 7\nThis is line 8\nThis is line 9\nThis is line 10\nThis is line 11\nThis is line 12\nThis is line 13\nThis is line 14\nThis is line 15\nThis is line 16\nThis is line 17\nThis is line 18\nThis is line 19\nThis is line 20", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano c01.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash c01.sh   (HAMESHA 'bash' se chalao. 'sh c01.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x c01.sh  phir  ./c01.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke c01.sh naam se save karo (Save as type: All Files), phir bash c01.sh"], "files": [{"name": "c01.sh", "text": "#!/usr/bin/env bash\nfor ((i=1; i<=20; i++)); do\n  echo \"This is line $i\"\ndone > lines.txt\nsplit -l 5 lines.txt part_\necho \"Generated files:\"\nls part_*\necho \"All contents in order:\"\ncat part_*\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-A3-02", "subject": "UNIX", "set": "UNIX Assignment 3 - File Processing Utilities", "no": "2", "title": "Comparing files (cmp, diff)", "question": "Create two text files and use cmp and diff commands to compare them. Display and explain the differences.", "qsrc": "refrence of freind/DEVRAJ_3.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_02_UNIX_File_Utilities_Assignment_3/Code/Program_02", "folder": "code/UX-A3-02/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "", "keywords": "compare cmp diff difference two files", "input": "", "output": "First difference (cmp):\nfile1.txt file2.txt differ: byte 8, line 2\nChanged lines (diff):\n2c2\n< Banana\n---\n> Blueberry\n3a4\n> Date", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano c02.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash c02.sh designed/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_02", "folder": "code/UX-P2-05/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "Same program as UX-A2-02. Source sheet numbering is irregular (Practical 5 / Question 6).", "keywords": "largest greatest three numbers", "input": "3 9 5", "output": "Largest: 9", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q02.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q02.sh   (HAMESHA 'bash' se chalao. 'sh q02.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q02.sh  phir  ./q02.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q02.sh naam se save karo (Save as type: All Files), phir bash q02.sh"], "files": [{"name": "q02.sh", "text": "#!/usr/bin/env bash\nread -r -p \"Enter three integers: \" a b c\nfor n in \"$a\" \"$b\" \"$c\"; do\n  [[ $n =~ ^-?[0-9]+$ ]] || { echo \"Invalid integer.\"; exit 1; }\ndone\nif ((a >= b && a >= c)); then\n  largest=$a\nelif ((b >= a && b >= c)); then\n  largest=$b\nelse\n  largest=$c\nfi\necho \"Largest: $largest\"\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-P2-07", "subject": "UNIX", "set": "UNIX Practical-2 (Unit 3) - official sheet", "no": "Practical 7 / Question 8", "title": "Student grade (nested if)", "question": "Write a shell script that accepts marks and displays the grade: A, B, C, D, Fail", "qsrc": "BCA sem-5 Assignment/UNIX/Copy of PRACTICAL_2[Unix and Shell Programming]unit_3.docx", "impl": "PRACTICAL_EXAM_COMPANION/code/UX-P2-07", "folder": "code/UX-P2-07/", "lang": "Bash shell script", "status": "ambiguous", "evidence": "Runs and tested (7 inputs) on Debian bash 5.2 + Git Bash 5.2; grade limits are an assumption.", "origin": "New (written + tested in this session)", "note": "Grade boundaries are NOT given in the question. Assumed: A>=80, B>=60, C>=50, D>=35, else Fail. Change if the teacher gives other limits.", "keywords": "grade marks nested if A B C D fail result", "input": "85", "output": "Grade: A", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano grade.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash grade.sh   (HAMESHA 'bash' se chalao. 'sh grade.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x grade.sh  phir  ./grade.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke grade.sh naam se save karo (Save as type: All Files), phir bash grade.sh"], "files": [{"name": "grade.sh", "text": "#!/usr/bin/env bash\n# Practical 7 (Unit 3): Student grade using nested if. Run: bash grade.sh\n# Grade limits are NOT given in the question; these are assumed. Change them if your teacher says so.\nread -p \"Enter marks (0-100): \" m\nif [ \"$m\" -ge 0 ] 2>/dev/null && [ \"$m\" -le 100 ]; then\n    if [ \"$m\" -ge 80 ]; then\n        echo \"Grade: A\"\n    else\n        if [ \"$m\" -ge 60 ]; then\n            echo \"Grade: B\"\n        else\n            if [ \"$m\" -ge 50 ]; then\n                echo \"Grade: C\"\n            else\n                if [ \"$m\" -ge 35 ]; then\n                    echo \"Grade: D\"\n                else\n                    echo \"Fail\"\n                fi\n            fi\n        fi\n    fi\nelse\n    echo \"Invalid marks\"\nfi\n"}], "pdf": "SHIVAM's ASSIGNMENTS/01_UNIX_Shell_Programming_SHIVAM_BHADORIYA.pdf"}, {"id": "UX-P2-09", "subject": "UNIX", "set": "UNIX Practical-2 (Unit 3) - official sheet", "no": "Practical 9 / Question 10", "title": "Menu-driven calculator (same as UX-A2-12)", "question": "Create a menu-driven calculator using the case statement for: Addition, Subtraction, Multiplication, Division, Exit", "qsrc": "BCA sem-5 Assignment/UNIX/Copy of PRACTICAL_2[Unix and Shell Programming]unit_3.docx", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_01_UNIX_Shell_Assignment_2/Code/Program_12", "folder": "code/UX-P2-09/", "lang": "Bash shell script", "status": "verified", "evidence": "bash -n + run with sample input on Debian bash 5.2 and Git Bash 5.2; outputs identical.", "origin": "Shivam folder (unchanged copy)", "note": "Same program as UX-A2-12 (also has modulus - extra).", "keywords": "menu calculator case", "input": "3 / 12 45 / 6", "output": "\n1. Add  2. Subtract  3. Multiply  4. Divide\n5. Modulus  6. Exit\nResult: 540\n\n1. Add  2. Subtract  3. Multiply  4. Divide\n5. Modulus  6. Exit\nGoodbye", "steps": ["Linux/Ubuntu terminal kholo. Folder me jao jahan file save karni hai (ya naya: mkdir prac; cd prac).", "nano q12.sh   -> code paste karo (Ctrl+Shift+V) -> Ctrl+O, Enter (save) -> Ctrl+X (exit).", "bash q12.sh   (HAMESHA 'bash' se chalao. 'sh q12.sh' mat likhna - Ubuntu par sh = dash hai, ye script fail hogi.)", "Option: chmod +x q12.sh  phir  ./q12.sh", "Windows lab ho to: Git Bash kholo, Notepad me code paste karke q12.sh naam se save karo (Save as type: All Files), phir bash q12.sh"], "files": [{"name": "q12.sh", "text": "#!/usr/bin/env bash\nwhile true; do\n  printf '\\n1. Add  2. Subtract  3. Multiply  4. Divide\\n'\n  printf '5. Modulus  6. Exit\\n'\n  read -r -p \"Choose 1-6: \" choice\n  case \"$choice\" in\n    6) echo \"Goodbye\"; break ;;\n    1|2|3|4|5) ;;\n    *) echo \"Invalid choice\"; continue ;;\n  esac\n  read -r -p \"Enter two integers: \" a b\n  if ! [[ $a =~ ^-?[0-9]+$ && $b =~ ^-?[0-9]+$ ]]; then\n    echo \"Invalid integer input\"; continue\n  fi\n  if [[ $choice == 4 || $choice == 5 ]] && ((b == 0)); then\n    echo \"Cannot use zero as divisor\"; continue\n  fi\n  case \"$choice\" in\n    1) answer=$((a+b)) ;; 2) answer=$((a-b)) ;;\n    3) answer=$((a*b)) ;; 4) answer=$((a/b est laptop.", "origin": "Shivam folder (code unchanged; Build_And_Inspect.txt instructions improved and tested; style.css not needed)", "note": " If Windows blocks Hello.exe, build a DLL (vbc /target:library) and inspect it with ildasm - see Build_And_Inspect.txt (improved copy).", "keywords": "msil il ildasm vbc compile intermediate language", "input": "", "output": "", "steps": ["Start menu -> 'Developer Command Prompt for VS' kholo (ya normal cmd). Folder me jao jahan Hello.vb save kiya.", "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\vbc.exe /target:exe /out:Hello.exe Hello.vb   -> Hello.exe banega", "Hello.exe   -> output: Hello from managed .NET code", "ildasm Hello.exe (GUI: Hello -> Main double-click) ya  ildasm /text Hello.exe  -> MSIL (ldstr, call, ret) dikhega. ildasm sirf Developer Command Prompt me PATH par hota hai.", "Windows Hello.exe block kare ('virus or potentially unwanted software'): vbc /target:library /out:HelloLib.dll Hello.vb  phir  ildasm /text HelloLib.dll"], "files": [{"name": "Hello.vb", "text": "Public Module Hello\n    Public Sub Main()\n        System.Console.WriteLine(\"Hello from managed .NET code\")\n    End Sub\nEnd Module\n"}, {"name": "Build_And_Inspect.txt", "text": "Program 4 - Demonstrate MSIL compilation\n==========================================\n\n1. Compile the VB source to an assembly (MSIL inside a PE file):\n     C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\vbc.exe /target:exe /out:Hello.exe Hello.vb\n   (In \"Developer Command Prompt for VS\" you can type just: vbc /target:exe /out:Hello.exe Hello.vb)\n\n2. Run it (the CLR JIT-compiles the IL to native code at run time):\n     Hello.exe\n   Expected output:  Hello from managed .NET code\n\n3. Inspect the MSIL with ildasm:\n     GUI : ildasm Hello.exe        -> expand \"Hello\" -> double-click \"Main : void()\"\n     Text: ildasm /text Hello.exe   (prints the IL to the console)\n   ildasm is not on the normal PATH. Full path on a machine with Visual Studio / .NET SDK:\n     \"C:\\Program Files (x86)\\Microsoft SDKs\\Windows\\v10.0A\\bin\\NETFX 4.8.1 Tools\\ildasm.exe\"\n\n   Expected IL for Main (verified):\n     IL_0000:  ldstr      \"Hello from managed .NET code\"\n     IL_0005:  call       void [mscorlib]System.Console::WriteLine(string)\n     IL_000a:  ret\n\nIf Windows blocks Hello.exe (\"file contains a virus or potentially unwanted software\",\ncaused by Smart App Control / Defender on brand-new unsigned exe files), build a DLL instead\nand inspect that - the IL of Main is identical:\n     vbc /target:library /out:HelloLib.dll Hello.vb\n     ildasm /text HelloLib.dll\n"}], "pdf": "SHIVAM's ASSIGNMENTS/02_ASP_NET_SHIVAM_BHADORIYA.pdf"}, {"id": "ASP-B-05", "subject": "ASP.NET", "set": "ASP.NET Basic / Foundation practicals (index page 2)", "no": "5", "title": "CLR and exception handling", "question": "Demonstrate CLR and Exception Handling", "qsrc": "refrence of freind/ASP.NET_INDEX.pdf", "impl": "SHIVAM's ASSIGNMENTS/Shivam_Assignments_Redesigned/Assignment_03_ASP_NET_Foundation_Practicals/Code/Program_05", "folder": "code/ASP-B-05/", "lang": "ASP.NET Web Forms (VB.NET, .NET Framework 4.7.2)", "status": "verified", "evidence": "aspnet_compiler PASS (0 errors/warnings, .NET Framework 4.8, Windows 11). Runtime on IIS Express 10 (65/65 checks, 2 runs): POST 12 -> 'Square = 144'; 'abc' -> FormatException message; 99999999999 -> OverflowException message: PASS.", "origin": "Shivam folder (unchanged copy)", "note": " CLR is only implied (page shows exception handling, not CLR details) - explain verbally: CLR runs the IL, manages memory and raises the exceptions.", "keywords": "clr exception try catch finally divide by zero error handling", "input": "", "output": "", "steps": ["Visual Studio -> File -> Open -> Web Site... -> ye program ka folder select karo (jisme Default.aspx hai).", "Solution Explorer me Default.aspx par right-click -> Set As Start Page -> Ctrl+F5 (Run).", "Agar naya project banana pade: File -> pp_Code/Db.vb", "text": "Imports System.Configuration\nImports System.Data\nImports System.Data.SqlClient\n\nPublic NotInheritable Class Db\n    Private Sub New()\n    End Sub\n\n    Private Shared ReadOnly ConnectionText As String =\n        ConfigurationManager.ConnectionStrings(\"con\").ConnectionString\n\n    Public Shared Function ReadTable(query As String,\n                                     ParamArray args() As SqlParameter) As DataTable\n        Dim result As New DataTable()\n        Using con As New SqlConnection(ConnectionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                Using adapter As New SqlDataAdapter(cmd)\n                    adapter.Fill(result)\n                End Using\n            End Using\n        End Using\n        Return result\n    End Function\n\n    Public Shared Function Execute(query As String,\n                                   ParamArray args() As SqlParameter) As Integer\n        Using con As New SqlConnection(ConnectionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                con.Open()\n                Return cmd.ExecuteNonQuery()\n            End Using\n        End Using\n    End Function\nEnd Class\n"}, {"name": "HOW_TO_RUN.md", "text": "# ASP.NET Assignment 2 - Windows setup\n\n1. Use **Visual Studio 2022 with ASP.NET and web development** plus **.NET Framework 4.7.2** targeting pack and SQL Server LocalDB.\n2. Run `PracticalDB.sql` against `(LocalDB)\\MSSQLLocalDB`.\n3. Each `Program_XX` folder is an independent **ASP.NET Web Site**, not an ASP.NET Core app. Open the desired folder with Visual Studio **File > Open > Web Site**.\n4. Review `Web.config` and adapt the connection string to your actual SQL Server. The sample uses Integrated Security.\n5. Run with IIS Express; test CRUD, navigation, form validation, cookie/session and logout.\n6. P et',35.50,80,'2027-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Prog3.aspx.vb", "text": "Partial Class Prog3\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Not IsPostBack Then\n            lblName.Text = \"Prince\"\n            lblRoll.Text = \"101\"\n            lblCourse.Text = \"TY BCA\"\n            lblSemester.Text = \"5\"\n        End If\n    End Sub\nEnd Class\n"}, {"name": "Student.master", "text": "<%@ Master Language=\"VB\" %>\n<!DOCTYPE html>\n<html><head runat=\"server\"><title>Student Portal<\/title>\n<link href=\"site.css\" rel=\"stylesheet\" /><\/head><body>\n<form id=\"form1\" runat=\"server\">\n<header class=\"portal-head\"><h1>Student Portal<\/h1><\/header>\n<nav><a href=\"Prog3.aspx\">Home<\/a>\n     <a href=\"Prog3.aspx\">Student Info<\/a>\n     <a href=\"Prog3.aspx\">About<\/a><\/nav>\n<div class=\"wrapper\">\n<asp:ContentPlaceHolder ID=\"MainContent\" runat=\"server\" />\n<\/div><footer>Vidhyadeep University · 2026<\/footer>\n<\/form><\/body><\/html>\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" />\n  <\/connectionStrings>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"4.7.2\" />\n    <httpRuntime targetFramework=\"4.7.2\" />\n  <\/system.web>\n<\/configuration>\n"}, {"name": "site.css", "text": "body { margin:0; background:#f4f8fa; color:#17344a;\n    font:15px/1.55 Arial,sans-serif; }\n.wrapper { max-width:930px; margin:34px auto; padding:26px 30px;\n    border-radius:11px; box-shadow:0 3px 24px #17344a17; background:#fff; }\nh1,h2 { color:#113249; }\n.field { margin tionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                Using adapter As New SqlDataAdapter(cmd)\n                    adapter.Fill(result)\n                End Using\n            End Using\n        End Using\n        Return result\n    End Function\n\n    Public Shared Function Execute(query As String,\n                                   ParamArray args() As SqlParameter) As Integer\n        Using con As New SqlConnection(ConnectionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                con.Open()\n                Return cmd.ExecuteNonQuery()\n            End Using\n        End Using\n    End Function\nEnd Class\n"}, {"name": "HOW_TO_RUN.md", "text": "# ASP.NET Assignment 2 - Windows setup\n\n1. Use **Visual Studio 2022 with ASP.NET and web development** plus **.NET Framework 4.7.2** targeting pack and SQL Server LocalDB.\n2. Run `PracticalDB.sql` against `(LocalDB)\\MSSQLLocalDB`.\n3. Each `Program_XX` folder is an independent **ASP.NET Web Site**, not an ASP.NET Core app. Open the desired folder with Visual Studio **File > Open > Web Site**.\n4. Review `Web.config` and adapt the connection string to your actual SQL Server. The sample uses Integrated Security.\n5. Run with IIS Express; test CRUD, navigation, form validation, cookie/session and logout.\n6. Programs 8 and 10 use hard-coded demo credentials `Prince` / `prince123`; these are teaching demonstrations, **not secure production authentication**.\n7. The deliverable's .NET compilation, SQL Server connection, and HTTP behavior are **not runtime-verified** here because a Windows .NET Framework/SQL Server toolchain is unavailable.\n"}, {"name": "PracticalDB.sql", "text": "-- SQL Server / LocalDB. Run in SSMS or sqlcmd before testing database pages.\nIF DB_ID('PracticalDB') IS NULL CREATE DATABASE PracticalDB;\nGO\nUSE PracticalD 27-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Prog4.aspx.vb", "text": "Imports System\nImports System.Data\nImports System.Data.SqlClient\nImports System.Globalization\n\nPartial Class Prog4\n    Inherits System.Web.UI.Page\n\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Not IsPostBack Then BindGrid()\n    End Sub\n\n    Private Sub BindGrid()\n        gvData.DataSource = Db.ReadTable(\n            \"SELECT * FROM Employee ORDER BY EmployeeID\")\n        gvData.DataBind()\n    End Sub\n\n    Private Function FormParams() As SqlParameter()\n        If String.IsNullOrWhiteSpace(txtEmployeeName.Text) Then\n            Throw New ArgumentException(\"Employee name is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtDepartment.Text) Then\n            Throw New ArgumentException(\"Department is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtSalary.Text) Then\n            Throw New ArgumentException(\"Salary is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtContactNo.Text) Then\n            Throw New ArgumentException(\"Contact no. is required.\")\n        End If\n        Return New SqlParameter() {\n            New SqlParameter(\"@EmployeeName\", txtEmployeeName.Text.Trim()),\n            New SqlParameter(\"@Department\", txtDepartment.Text.Trim()),\n            New SqlParameter(\"@Salary\", Decimal.Parse(txtSalary.Text, CultureInfo.InvariantCulture)),\n            New SqlParameter(\"@ContactNo\", txtContactNo.Text.Trim())\n        }\n    End Function\n\n    Private Sub ResetForm()\n        txtEmployeeName.Text = \"\"\n        txtDepartment.Text = \"\"\n        txtSalary.Text = \"\"\n        txtContactNo.Text = \"\"\n        hfKey.Value = \"\"\n        gvData.SelectedIndex = -1\n    End Sub\n\n    Protected Sub btnAdd_Click(sender As Object, e As EventArgs)\n        Try\n            Db.Execute(\"INSERT INTO Employee (EmployeeName,Department,Salary,ContactNo) \" &\n                \"VALUES (@EmployeeName,@Department,@Salary,@ContactNo)\", FormParams())\n            lblMessage.Text = \"Record inserted.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Insert failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnUpdate_Click(sender As Object, e As EventArgs)\n        If hfKey.Value = \"\" Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Try\n            Dim ps As New List(Of SqlParameter)(FormParams())\n            ps.Add(New SqlParameter(\"@Key\", Integer.Parse(hfKey.Value)))\n            Db.Execute(\"UPDATE Employee SET EmployeeName=@EmployeeName,Department=@Department,Salary=@Salary,ContactNo=@ContactNo WHERE EmployeeID=@Key\", ps.ToArray())\n            lblMessage.Text = \"Record updated.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Update failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnDelete_Click(sender As Object, e As EventArgs)\n        Dim key As Integer\n        If Not Integer.TryParse(hfKey.Value, key) Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Db.Execute(\"DELETE FROM Employee WHERE EmployeeID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        lblMessage.Text = \"Record deleted.\"\n        ResetForm()\n        BindGrid()\n    End Sub\n\n    Protected Sub btnClear_Click(sender As Object, e As EventArgs)\n        ResetForm()\n        lblMessage.Text = \"\"\n    End Sub\n\n    Protected Sub gvData_SelectedIndexChanged(sender As Object, e As EventArgs)\n        Dim key As Integer = Convert.ToInt32(gvData.SelectedDataKey.Value)\n        Dim data As DataTable = Db.ReadTable(\n            \"SELECT * FROM Employee WHERE EmployeeID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        If data.Rows.Count = 0 Then Return\n        Dim row As DataRow = data.Rows(0)\n        hfKey.Value = key.ToString()\n        txtEmployeeName.Text = row(\"EmployeeName\").ToString()\n        txtDepartment.Text = row(\"Department\").ToString()\n        txtSalary.Text = row(\"Salary\").ToString()\n        txtContactNo.Text = row(\"ContactNo\").ToString()\n    End Sub\nEnd Class\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" />\n  <\/connectionStrings>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"4.7.2\" />\n    <httpRuntime targetFramework=\"4.7.2\" />\n  <\/system.web>\n<\/configuration>\n"}, {"name": "site.css", "text": "body { margin:0; background:#f4f8fa; color:#17344a;\n    font:15px/1.55 Arial,sans-serif; }\n.wrapper { max-width:930px; margin:34px auto; padding:26px 30px;\n    border-radius:11px; box-shadow:0 3px 24px #17344a17; background:#fff; }\nh1,h2 { color:#113249; }\n.field { margin:9px 0; display:flex; gap:15px; align-items:center; }\n.field label { width:160px; font-weight:bold; }\ninput,select,textarea { padding:9px 10px; border:1px solid #b9cdd6;\n    border-radius:6px; min-width:230px; box-sizing:border-box; }\n.action { background:#0a6774; border:0; border-radius:5px;\n    color:#fff; padding:10px 16px; cursor:pointer; margin:6px 8px 6px 0; }\n.grid { border-collapse:collapse; width:100%; margin-top:20px; }\n.grid th { background:#e6f1f3; color:#133047; }\n.grid td,.grid th { border-bottom:1px solid #d6e1e7;\n    text-align:left; padding:9px; }\n.message { margin:11px 0; display:block; color:#0a6774; }\n.error { color:#b42318; }\n.portal- er\" CssClass=\"grid\"\n    AutoGenerateColumns=\"False\" AutoGenerateSelectButton=\"True\"\n    DataKeyNames=\"CustomerID\" OnSelectedIndexChanged=\"gvData_SelectedIndexChanged\">\n  <Columns>\n    <asp:BoundField DataField=\"CustomerID\" HeaderText=\"ID\" />\n    <asp:BoundField DataField=\"CustomerName\" HeaderText=\"Customer name\" />\n    <asp:BoundField DataField=\"Email\" HeaderText=\"Email\" />\n    <asp:BoundField DataField=\"Phone\" HeaderText=\"Phone\" />\n    <asp:BoundField DataField=\"Address\" HeaderText=\"Address\" />\n  <\/Columns>\n<\/asp:GridView>\n\n<\/div><\/form><\/body><\/html>\n"}, {"name": "App_Code/Db.vb", "text": "Imports System.Configuration\nImports System.Data\nImports System.Data.SqlClient\n\nPublic NotInheritable Class Db\n    Private Sub New()\n    End Sub\n\n    Private Shared ReadOnly ConnectionText As String =\n        ConfigurationManager.ConnectionStrings(\"con\").ConnectionString\n\n    Public Shared Function ReadTable(query As String,\n                                     ParamArray args() As SqlParameter) As DataTable\n        Dim result As New DataTable()\n        Using con As New SqlConnection(ConnectionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                Using adapter As New SqlDataAdapter(cmd)\n                    adapter.Fill(result)\n                End Using\n            End Using\n        End Using\n        Return result\n    End Function\n\n    Public Shared Function Execute(query As String,\n                                   ParamArray args() As SqlParameter) As Integer\n        Using con As New SqlConnection(ConnectionText)\n            Using cmd As New SqlCommand(query, con)\n                If args.Length > 0 Then cmd.Parameters.AddRange(args)\n                con.Open()\n                Return cmd.ExecuteNonQuery()\n            End Using\n        End Using\n    End Function\nEnd Class\n"}, {"name": "HOW_TO_RUN.md", "text": "# ASP.NET Assignment 2 - Windows setup\n\n1. Use **Visual Studio 2022 with ASP.NET and web development** plus **.NET Framework 4.7.2** targeting pack and SQL Server LocalDB.\n2. Run `PracticalDB.sql` against `(LocalDB)\\MSSQLLocalDB`.\n3. Each `Program_XX` folder is an independent **ASP.NET Web Site**, not an ASP.NET Core app. Open the desired folder with Visual Studio **File > Open > Web Site**.\n4. Review `Web.config` and adapt the connection string to your actual SQL Server. The sample uses Integrated Security.\n5. Run with IIS Express; test CRUD, navigation, form validation, cookie/session and logout.\n6. Programs 8 and 10 use hard-coded demo credentials `Prince` / `prince123`; these are teaching demonstrations, **not secure production authentication**.\n7. The deliverable's .NET compilation, SQL Server connection, and HTTP behavior are **not runtime-verified** here because a Windows .NET Framework/SQL Server toolchain is unavailable.\n"}, {"name": "PracticalDB.sql", "text": "-- SQL Server / LocalDB. Run in SSMS or sqlcmd before testing database pages.\nIF DB_ID('PracticalDB') IS NULL CREATE DATABASE PracticalDB;\nGO\nUSE PracticalDB;\nGO\nIF OBJECT_ID('dbo.Students','U') IS NULL\nCREATE TABLE dbo.Students (\n  RollNo INT PRIMARY KEY, Name NVARCHAR(50) NOT NULL,\n  Age INT NOT NULL CHECK (Age BETWEEN 1 AND 120),\n  Gender NVARCHAR(10) NOT NULL, Course NVARCHAR(30) NOT NULL\n);\nIF OBJECT_ID('dbo.Employee','U') IS NULL\nCREATE TABLE dbo.Employee (\n  EmployeeID INT IDENTITY(1,1) PRIMARY KEY,\n  EmployeeName NVARCHAR(50) NOT NULL, Department NVARCHAR(30) NOT NULL,\n  Salary DECIMAL(10,2) NOT NULL CHECK (Salary >= 0),\n  ContactNo NVARCHAR(15) NOT NULL\n);\nIF OBJECT_ID('dbo.Customer','U') IS NULL\nCREATE TABLE dbo.Customer (\n  CustomerID INT IDENTITY(1,1) PRIMARY KEY,\n  CustomerName NVARCHAR(50) NOT NULL, Email NVARCHAR(60) NOT NULL,\n  Phone NVARCHAR(15) NOT NULL, Address NVARCHAR(100) NOT NULL\n);\nIF OBJECT_ID('dbo.Medicine','U') IS NULL\nCREATE TABLE dbo.Medicine (\n  MedicineID INT IDENTITY(1,1) PRIMARY KEY,\n  MedicineName NVARCHAR(50) NOT NULL, Category NVARCHAR(30) NOT NULL,\n  Price DECIMAL(10,2) NOT NULL CHECK (Price >= 0),\n  Quantity INT NOT NULL CHECK (Quantity >= 0), ExpiryDate DATE NOT NULL\n);\nGO\n-- Demonstration rows only, inserted once when empty.\nIF NOT EXISTS (SELECT 1 FROM dbo.Students)\n INSERT dbo.Students (RollNo,Name,Age,Gender,Course) VALUES\n (101,'Prince',19,'Male','BCA'),(102,'Karan',20,'Male','BCA'),\n (103,'Harshit',21,'Male','BBA'),(104,'Jeel',18,'Male','BA');\nIF NOT EXISTS (SELECT 1 FROM dbo.Employee)\n INSERT dbo.Employee (EmployeeName,Department,Salary,ContactNo) VALUES\n ('Prince','IT',45000,'9568650011'),('Karan','HR',32000,'9876588022'),\n ('Harshit','Sales',38000,'9876567033');\nIF NOT EXISTS (SELECT 1 FROM dbo.Customer)\n INSERT dbo.Customer (CustomerName,Email,Phone,Address) VALUES\n ('Kevin','kevin4@example.com','9876589044','Surat'),\n ('Ram','ram3@example.com','9876592033','Gandhinagar');\nIF NOT EXISTS (SELECT 1 FROM dbo.Medicine)\n INSERT dbo.Medicine (MedicineName,Category,Price,Quantity,ExpiryDate) VALUES\n ('Cetirizine','Tablet',35.50,80,'2027-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Prog5.aspx.vb", "text": "Imports System\nImports System.Data\nImports System.Data.SqlClient\nImports System.Globalization\n\nPartial Class Prog5\n    Inherits System.Web.UI.Page\n\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Not IsPostBack Then BindGrid()\n    End Sub\n\n    Private Sub BindGrid()\n        gvData.DataSource = Db.ReadTable(\n            \"SELECT * FROM Customer ORDER BY CustomerID\")\n        gvData.DataBind()\n    End Sub\n\n    Private Function FormParams() As SqlParameter()\n        If String.IsNullOrWhiteSpace(txtCustomerName.Text) Then\n            Throw New ArgumentException(\"Customer name is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtEmail.Text) Then\n            Throw New ArgumentException(\"Email is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtPhone.Text) Then\n            Throw New ArgumentException(\"Phone is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtAddress.Text) Then\n            Throw New ArgumentException(\"Address is required.\")\n        End If\n        Return New SqlParameter() {\n            New SqlParameter(\"@CustomerName\", txtCustomerName.Text.Trim()),\n            New SqlParameter(\"@Email\", txtEmail.Text.Trim()),\n            New SqlParameter(\"@Phone\", txtPhone.Text.Trim()),\n            New SqlParameter(\"@Address\", txtAddress.Text.Trim())\n        }\n    End Function\n\n    Private Sub ResetForm()\n        txtCustomerName.Text = \"\"\n        txtEmail.Text = \"\"\n        txtPhone.Text = \"\"\n        txtAddress.Text = \"\"\n        hfKey.Value = \"\"\n        gvData.SelectedIndex = -1\n    End Sub\n\n    Protected Sub btnAdd_Click(sender As Object, e As EventArgs)\n        Try\n            Db.Execute(\"INSERT INTO Customer (CustomerName,Email,Phone,Address) \" &\n                \"VALUES (@CustomerName,@Email,@Phone,@Address)\", FormParams())\n            lblMessage.Text = \"Record inserted.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Insert failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnUpdate_Click(sender As Object, e As EventArgs)\n        If hfKey.Value = \"\" Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Try\n            Dim ps As New List(Of SqlParameter)(FormParams())\n            ps.Add(New SqlParameter(\"@Key\", Integer.Parse(hfKey.Value)))\n            Db.Execute(\"UPDATE Customer SET CustomerName=@CustomerName,Email=@Email,Phone=@Phone,Address=@Address WHERE CustomerID=@Key\", ps.ToArray())\n            lblMessage.Text = \"Record updated.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Update failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnDelete_Click(sender As Object, e As EventArgs)\n        Dim key As Integer\n        If Not Integer.TryParse(hfKey.Value, key) Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Db.Execute(\"DELETE FROM Customer WHERE CustomerID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        lblMessage.Text = \"Record deleted.\"\n        ResetForm()\n        BindGrid()\n    End Sub\n\n    Protected Sub btnClear_Click(sender As Object, e As EventArgs)\n        ResetForm()\n        lblMessage.Text = \"\"\n    End Sub\n\n    Protected Sub gvData_SelectedIndexChanged(sender As Object, e As EventArgs)\n        Dim key As Integer = Convert.ToInt32(gvData.SelectedDataKey.Value)\n        Dim data As DataTable = Db.ReadTable(\n            \"SELECT * FROM Customer WHERE CustomerID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        If data.Rows.Count = 0 Then Return\n        Dim row As DataRow = data.Rows(0)\n        hfKey.Value = key.ToString()\n        txtCustomerName.Text = row(\"CustomerName\").ToString()\n        txtEmail.Text = row(\"Email\").ToString()\n        txtPhone.Text = row(\"Phone\").ToString()\n        txtAddress.Text = row(\"Address\").ToString()\n    End Sub\nEnd Class\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" />\n  <\/connectionStrings>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"4.7.2\" />\n    <httpRuntime targetFramework=\"4.7 '9876588022'),\n ('Harshit','Sales',38000,'9876567033');\nIF NOT EXISTS (SELECT 1 FROM dbo.Customer)\n INSERT dbo.Customer (CustomerName,Email,Phone,Address) VALUES\n ('Kevin','kevin4@example.com','9876589044','Surat'),\n ('Ram','ram3@example.com','9876592033','Gandhinagar');\nIF NOT EXISTS (SELECT 1 FROM dbo.Medicine)\n INSERT dbo.Medicine (MedicineName,Category,Price,Quantity,ExpiryDate) VALUES\n ('Cetirizine','Tablet',35.50,80,'2027-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Prog6.aspx.vb", "text": "Imports System\nImports System.Data\nImports System.Data.SqlClient\nImports System.Globalization\n\nPartial Class Prog6\n    Inherits System.Web.UI.Page\n\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Not IsPostBack Then BindGrid()\n    End Sub\n\n    Private Sub BindGrid()\n        gvData.DataSource = Db.ReadTable(\n            \"SELECT * FROM Students ORDER BY RollNo\")\n        gvData.DataBind()\n    End Sub\n\n    Private Function FormParams() As SqlParameter()\n        If String.IsNullOrWhiteSpace(txtRollNo.Text) Then\n            Throw New ArgumentException(\"Roll no. is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtName.Text) Then\n            Throw New ArgumentException(\"Student name is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtAge.Text) Then\n            Throw New ArgumentException(\"Age is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtGender.SelectedValue) Then\n            Throw New ArgumentException(\"Gender is required.\")\n        End If\n        If String.IsNullOrWhiteSpace(txtCourse.Text) Then\n            Throw New ArgumentException(\"Course is required.\")\n        End If\n        Return New SqlParameter() {\n            New SqlParameter(\"@RollNo\", Integer.Parse(txtRollNo.Text, CultureInfo.InvariantCulture)),\n            New SqlParameter(\"@Name\", txtName.Text.Trim()),\n            New SqlParameter(\"@Age\", Integer.Parse(txtAge.Text, CultureInfo.InvariantCulture)),\n            New SqlParameter(\"@Gender\", txtGender.SelectedValue),\n            New SqlParameter(\"@Course\", txtCourse.Text.Trim())\n        }\n    End Function\n\n    Private Sub ResetForm()\n        txtRollNo.Text = \"\"\n        txtName.Text = \"\"\n        txtAge.Text = \"\"\n        txtGender.SelectedIndex = 0\n        txtCourse.Text = \"\"\n        txtRollNo.ReadOnly = False\n        hfKey.Value = \"\"\n        gvData.SelectedIndex = -1\n    End Sub\n\n    Protected Sub btnAdd_Click(sender As Object, e As EventArgs)\n        Try\n            Db.Execute(\"INSERT INTO Students (RollNo,Name,Age,Gender,Course) \" &\n                \"VALUES (@RollNo,@Name,@Age,@Gender,@Course)\", FormParams())\n            lblMessage.Text = \"Record inserted.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Insert failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnUpdate_Click(sender As Object, e As EventArgs)\n        If hfKey.Value = \"\" Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Try\n            Dim ps As New List(Of SqlParameter)(FormParams())\n            ps.Add(New SqlParameter(\"@Key\", Integer.Parse(hfKey.Value)))\n            Db.Execute(\"UPDATE Students SET Name=@Name,Age=@Age,Gender=@Gender,Course=@Course WHERE RollNo=@Key\", ps.ToArray())\n            lblMessage.Text = \"Record updated.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Update failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnDelete_Click(sender As Object, e As EventArgs)\n        Dim key As Integer\n        If Not Integer.TryParse(hfKey.Value, key) Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Db.Execute(\"DELETE FROM Students WHERE RollNo=@Key\",\n            New SqlParameter(\"@Key\", key))\n        lblMessage.Text = \"Record deleted.\"\n        ResetForm()\n        BindGrid()\n    End Sub\n\n    Protected Sub btnClear_Click(sender As Object, e As EventArgs)\n        ResetForm()\n        lblMessage.Text = \"\"\n    End Sub\n\n    Protected Sub gvData_SelectedIndexChanged(sender As Object, e As EventArgs)\n        Dim key As Integer = Convert.ToInt32(gvData.SelectedDataKey.Value)\n        Dim data As DataTable = Db.ReadTable(\n            \"SELECT * FROM Students WHERE RollNo=@Key\",\n            New SqlParameter(\"@Key\", key))\n        If data.Rows.Count = 0 Then Return\n        Dim row As DataRow = data.Rows(0)\n        hfKey.Value = key.ToString()\n        txtRollNo.Text = row(\"RollNo\").ToString()\n        txtName.Text = row(\"Name\").ToString()\n        txtAge.Text = row(\"Age\").ToString()\n        txtGender.SelectedValue = row(\"Gender\").ToString()\n        txtCourse.Text = row(\"Course\").ToString()\n        txtRollNo.ReadOnly = True\n    End Sub\nEnd Class\n"}, {"name": "Student.master", "text": "<%@ Master Language=\"VB\" %>\n<!DOCTYPE html>\n<html><head runat=\"server\"><title>College Portal<\/title>\n<link href=\"site.css\" rel=\"stylesheet\" /><\/head><body>\n<form id=\"form1\" runat=\"server\">\n<header class=\"portal-head\"><h1>College Portal<\/h1><\/header>\n<nav><a href=\"Prog6.aspx\">Home<\/a>\n     <a href=\"Prog6.aspx\">Students<\/a>\n     <a href=\"Prog6.aspx\">Contact<\/a><\/nav>\n<div class=\"wrapper\">\n<asp:ContentPlaceHolder ID=\"MainContent\" runat=\"server\" />\n<\/div><footer>Vidhyadeep University · 2026<\/footer>\n<\/form><\/body><\/html>\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n = \"Record updated.\"\n            ResetForm()\n            BindGrid()\n        Catch ex As Exception\n            lblMessage.Text = \"Update failed: check all field values.\"\n        End Try\n    End Sub\n\n    Protected Sub btnDelete_Click(sender As Object, e As EventArgs)\n        Dim key As Integer\n        If Not Integer.TryParse(hfKey.Value, key) Then\n            lblMessage.Text = \"Select a record first.\"\n            Return\n        End If\n        Db.Execute(\"DELETE FROM Medicine WHERE MedicineID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        lblMessage.Text = \"Record deleted.\"\n        ResetForm()\n        BindGrid()\n    End Sub\n\n    Protected Sub btnClear_Click(sender As Object, e As EventArgs)\n        ResetForm()\n        lblMessage.Text = \"\"\n    End Sub\n\n    Protected Sub gvData_SelectedIndexChanged(sender As Object, e As EventArgs)\n        Dim key As Integer = Convert.ToInt32(gvData.SelectedDataKey.Value)\n        Dim data As DataTable = Db.ReadTable(\n            \"SELECT * FROM Medicine WHERE MedicineID=@Key\",\n            New SqlParameter(\"@Key\", key))\n        If data.Rows.Count = 0 Then Return\n        Dim row As DataRow = data.Rows(0)\n        hfKey.Value = key.ToString()\n        txtMedicineName.Text = row(\"MedicineName\").ToString()\n        txtCategory.Text = row(\"Category\").ToString()\n        txtPrice.Text = row(\"Price\").ToString()\n        txtQuantity.Text = row(\"Quantity\").ToString()\n        txtExpiryDate.Text = CDate(row(\"ExpiryDate\")).ToString(\"yyyy-MM-dd\")\n    End Sub\nEnd Class\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" /> assword<\/label><asp:TextBox ID=\"txtPass\" runat=\"server\" TextMode=\"Password\" /><\/div>\n<asp:Button ID=\"btnLogin\" runat=\"server\" Text=\"Login\" CssClass=\"action\" OnClick=\"btnLogin_Click\" />\n<asp:Label ID=\"lblMessage\" runat=\"server\" CssClass=\"error\" />\n<\/div><\/form><\/body><\/html>\n"}, {"name": "HOW_TO_RUN.md", "text": "# ASP.NET Assignment 2 - Windows setup\n\n1. Use **Visual Studio 2022 with ASP.NET and web development** plus **.NET Framework 4.7.2** targeting pack and SQL Server LocalDB.\n2. Run `PracticalDB.sql` against `(LocalDB)\\MSSQLLocalDB`.\n3. Each `Program_XX` folder is an independent **ASP.NET Web Site**, not an ASP.NET Core app. Open the desired folder with Visual Studio **File > Open > Web Site**.\n4. Review `Web.config` and adapt the connection string to your actual SQL Server. The sample uses Integrated Security.\n5. Run with IIS Express; test CRUD, navigation, form validation, cookie/session and logout.\n6. Programs 8 and 10 use hard-coded demo credentials `Prince` / `prince123`; these are teaching demonstrations, **not secure production authentication**.\n7. The deliverable's .NET compilation, SQL Server connection, and HTTP behavior are **not runtime-verified** here because a Windows .NET Framework/SQL Server toolchain is unavailable.\n"}, {"name": "Login.aspx.vb", "text": "Partial Class Login\n    Inherits System.Web.UI.Page\n    Protected Sub btnLogin_Click(sender As Object, e As EventArgs)\n        If txtUser.Text = \"Prince\" AndAlso txtPass.Text = \"prince123\" Then\n            Session(\"redirectUser\") = txtUser.Text\n            Response.Redirect(\"Welcome.aspx\")\n        Else\n            lblMessage.Text = \"Invalid username or password.\"\n        End If\n    End Sub\nEnd Class\n"}, {"name": "PracticalDB.sql", "text": "-- SQL Server / LocalDB. Run in SSMS or sqlcmd before testing database pages.\nIF DB_ID('PracticalDB') IS NULL CREATE DATABASE PracticalDB;\nGO\nUSE PracticalDB;\nGO\nIF OBJECT_ID('dbo.Students','U') IS NULL\nCREATE TABLE dbo.Students (\n  RollNo INT PRIMARY KEY, Name NVARCHAR(50) NOT NULL,\n  Age INT NOT NULL CHECK (Age BETWEEN 1 AND 120),\n  Gender NVARCHAR(10) NOT NULL, Course NVARCHAR(30) NOT NULL\n);\nIF OBJECT_ID('dbo.Employee','U') IS NULL\nCREATE TABLE dbo.Employee (\n  EmployeeID INT IDENTITY(1,1) PRIMARY KEY,\n  EmployeeName NVARCHAR(50) NOT NULL, Department NVARCHAR(30) NOT NULL,\n  Salary DECIMAL(10,2) NOT NULL CHECK (Salary >= 0),\n  ContactNo NVARCHAR(15) NOT NULL\n);\nIF OBJECT_ID('dbo.Customer','U') IS NULL\nCREATE TABLE dbo.Customer (\n  CustomerID INT IDENTITY(1,1) PRIMARY KEY,\n  CustomerName NVARCHAR(50) NOT NULL, Email NVARCHAR(60) NOT NULL,\n  Phone NVARCHAR(15) NOT NULL, Address NVARCHAR(100) NOT NULL\n);\nIF OBJECT_ID('dbo.Medicine','U') IS NULL\nCREATE TABLE dbo.Medicine (\n  MedicineID INT IDENTITY(1,1) PRIMARY KEY,\n  MedicineName NVARCHAR(50) NOT NULL, Category NVARCHAR(30) NOT NULL,\n  Price DECIMAL(10,2) NOT NULL CHECK (Price >= 0),\n  Quantity INT NOT NULL CHECK (Quantity >= 0), ExpiryDate DATE NOT NULL\n);\nGO\n-- Demonstration rows only, inserted once when empty.\nIF NOT EXISTS (SELECT 1 FROM dbo.Students)\n INSERT dbo.Students (RollNo,Name,Age,Gender,Course) VALUES\n (101,'Prince',19,'Male','BCA'),(102,'Karan',20,'Male','BCA'),\n (103,'Harshit',21,'Male','BBA'),(104,'Jeel',18,'Male','BA');\nIF NOT EXISTS (SELECT 1 FROM dbo.Employee)\n INSERT dbo.Employee (EmployeeName,Department,Salary,ContactNo) VALUES\n ('Prince','IT',45000,'9568650011'),('Karan','HR',32000,'9876588022'),\n ('Harshit','Sales',38000,'9876567033');\nIF NOT EXISTS (SELECT 1 FROM dbo.Customer)\n INSERT dbo.Customer (CustomerName,Email,Phone,Address) VALUES\n ('Kevin','kevin4@example.com','9876589044','Surat'),\n ('Ram','ram3@example.com','9876592033','Gandhinagar');\nIF NOT EXISTS (SELECT 1 FROM dbo.Medicine)\n INSERT dbo.Medicine (MedicineName,Category,Price,Quantity,ExpiryDate) VALUES\n ('Cetirizine','Tablet',35.50,80,'2027-08-31'),\n ('Vitamin Syrup','Syrup',95.00,50,'2027-09-15');\nGO\n"}, {"name": "Web.config", "text": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\" value=\"None\" />\n  <\/appSettings>\n  <connectionStrings>\n    <add name=\"con\" providerName=\"System.Data.SqlClient\"\n      connectionString=\"Data Source=(LocalDB)\\MSSQLLocalDB;Initial Catalog=PracticalDB;Integrated Security=True\" />\n  <\/connectionStrings>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"4.7.2\" />\n    <httpRuntime targetFramework=\"4.7.2\" />\n  <\/system.web>\n<\/configuration>\n"}, {"name": "Welcome.aspx", "text": "<%@ Page Language=\"VB\" AutoEventWireup=\"true\" CodeFile=\"Welcome.aspx.vb\" Inherits=\"Welcome\" %>\n<!DOCTYPE html>\n<html><head runat=\"server\"><title>Welcome<\/title><link href=\"site.css\" rel=\"stylesheet\" /><\/head><body><form id=\"form1\" runat=\"server\">\n<div class=\"wrapper\"><h2>Welcome<\/h2>\n<asp:Label ID=\"lblWelcome\" runat=\"server\" CssClass=\"message\" />\n<a href=\"Login.aspx\">Back to login<\/a>\n<\/div><\/form><\/body><\/html>\n"}, {"name": "Welcome.aspx.vb", "text": "Partial Class Welcome\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        If Session(\"redirectUser\") Is Nothing Then\n            Response.Redirect(\"Login.aspx\")\n            Return\n        End If\n        lblWelcome.Text = \"Welcome, \" &\n            Server.HtmlEncode(Session(\"redirectUser\").ToString()) & \"!\"\n    End Sub\nEnd Class\n"}, {"name": "site.css", "text": "body { margin:0; background:#f4f8fa; color:#17344a;\n    font:15px/1.55 Arial,sans-serif; }\n.wrapper { max-width:930px; margin:34px auto; padding:26px 30px;\n    border-radius:11px; box-shadow:0 3px 24px #17344a17; background:#fff; }\nh1,h2 { color:#113249; }\n.field { margin:9px 0; display:flex; gap:15px; align-items:center; }\n.field label { width:160px; font-weight:bold; }\ninput,sele ssClass=\"message\" />\n<p><a href=\"SetCookie.aspx\">Back<\/a><\/p>\n<\/div><\/form><\/body><\/html>\n"}, {"name": "GetCookie.aspx.vb", "text": "Partial Class GetCookie\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(sender As Object, e As EventArgs)\n        Dim item As HttpCookie = Request.Cookies(\"UserName\")\n        lblResult.Text = If(item Is Nothing,\n            \"No cookie found.\",\n            \"Hello, \" & Server.HtmlEncode(Server.UrlDecode(item.Value)))\n    End Sub\nEnd Class\n"}, {"name": "HOW_TO_RUN.md", "text": "# ASP.NET Assignment 2 - Windows setup\n\n1. Use **Visual Studio 2022 with ASP.NET and web development** plus **.NET Framework 4.7.2** targeting pack and SQL Server LocalDB.\n2. Run `PracticalDB.sql` against `(LocalDB)\\MSSQLLocalDB`.\n3. Each `Program_XX` folder is an independent **ASP.NET Web Site**, not an ASP.NET Core app. Open the desired folder with Visual Studio **File > Open > Web Site**.\n4. Review `Web.config` and adapt the connection string to your actual SQL Server. The sample uses Integrated Security.\n5. Run with IIS Express; test CRUD, navigation, form validation, cookie/session and logout.\n6. Programs 8 and 10 use hard-coded demo credentials `Prince` / `prince123`; these are teaching demonstrations, **not secure production authentication**.\n7. The deliverable's .NET compilation, SQL Server connection, and HTTP behavior are **not runtime-verified** here because a Windows .NET Framework/SQL Server toolchain is unavailable.\n"}, {"name": "PracticalDB.sql", "text": "-- SQL Server / LocalDB. Run in SSMS or sqlcmd before testing database pages.\nIF DB_ID('PracticalDB') IS NULL CREATE DATABASE PracticalDB;\nGO\nUSE PracticalDB;\nGO\nIF OBJECT_ID('dbo.Students','U') IS NULL\nCREATE TABLE dbo.Students (\n  RollNo INT PRIMARY KEY, Name NVARCHAR(50) NOT NULL,\n  Age INT NOT NULL CHECK (Age BETWEEN 1 AND 120),\n  Gender NVARCHAR(10) NOT NULL, Course NVARCHAR(30) NOT NULL\n);\nIF OBJECT_ID('dbo.Employee','U') IS NULL\nCR
